name: B2 Restore Test

on:
  workflow_dispatch:

env:
  B2_KEY_ID: "0047c90ff6f40880000000006"
  B2_APP_KEY: "K0040AwDa89YUhD+vuwO6VoR1cxS3QA"
  B2_BUCKET: "my-files-backup-forrdp"
  B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
  B2_REGION: "us-west-004"

jobs:
  test-restore:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: "[1/6]  Install AWS CLI"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ AWS CLI Install ─────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $installer = "$env:TEMP\AWSCLIV2.msi"
          if (-not (Test-Path "C:\Program Files\Amazon\AWSCLIV2\aws.exe")) {
            Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile $installer -UseBasicParsing
            Start-Process msiexec.exe -ArgumentList "/i $installer /quiet /norestart" -Wait
            Start-Sleep -Seconds 5
          }
          Write-Host "    ✓  AWS CLI ready" -ForegroundColor Green
          Write-Host ""
          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""

      - name: "[2/6]  Install 7-Zip"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ 7-Zip Install ──────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZipExe) {
            Write-Host "    ✓  Already installed" -ForegroundColor Green
          } else {
            $msi = "$env:TEMP\7z.msi"
            Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2301-x64.msi" -OutFile $msi -UseBasicParsing
            Start-Process msiexec.exe -ArgumentList "/i $msi /quiet /norestart" -Wait
            Start-Sleep -Seconds 5
            Write-Host "    ✓  Installed" -ForegroundColor Green
          }

          if (-not (Test-Path $sevenZipExe)) {
            Write-Host "    ✗  7z.exe not found" -ForegroundColor Red
            exit 1
          }
          Write-Host "    ✓  7z.exe ready" -ForegroundColor Green
          Write-Host ""
          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""

      - name: "[3/6]  Verify B2 Access"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ B2 Verification ────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "    Head bucket..." -ForegroundColor Cyan
          & $aws s3api head-bucket --bucket $env:B2_BUCKET --endpoint-url $endpoint 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "    ✗  Head bucket failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "    ✓  Bucket accessible" -ForegroundColor Green
          Write-Host ""

          Write-Host "    List bucket objects..." -ForegroundColor Cyan
          $listResult = & $aws s3 ls "s3://$env:B2_BUCKET/" --endpoint-url $endpoint 2>&1
          if ($listResult) {
            $listResult | ForEach-Object { Write-Host "      $_" -ForegroundColor Gray }
          } else {
            Write-Host "      (empty)" -ForegroundColor Gray
          }
          Write-Host ""

          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[4/6]  List Objects via s3api"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ List Objects (s3api) ────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "    list-objects-v2 ..." -ForegroundColor Cyan
          $remoteObjects = & $aws s3api list-objects-v2 `
            --bucket $env:B2_BUCKET `
            --endpoint-url $endpoint `
            --query "Contents[].[Key,Size,LastModified]" `
            --output json 2>&1

          Write-Host "    Raw result:" -ForegroundColor Gray
          Write-Host $remoteObjects -ForegroundColor DarkGray
          Write-Host ""

          if ($LASTEXITCODE -ne 0) {
            Write-Host "    ✗  list-objects-v2 failed" -ForegroundColor Red
            exit 1
          }

          $parsed = $remoteObjects | ConvertFrom-Json
          if ($parsed) {
            foreach ($item in $parsed) {
              $key  = $item[0]
              $size = [math]::Round($item[1] / 1MB, 2)
              $date = $item[2]
              Write-Host "      • $key  ($size MB)  $date" -ForegroundColor Gray
            }
          } else {
            Write-Host "      (empty)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[5/6]  Test Download (s3 cp)"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Download Test ───────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          $tests = @(
            @{ Key = "telegram-portable.zip"; Local = "C:\test-telegram.zip" },
            @{ Key = "userdata.zip";          Local = "C:\test-userdata.zip" }
          )

          foreach ($t in $tests) {
            Write-Host "    Testing: $($t.Key)" -ForegroundColor Cyan
            if (Test-Path $t.Local) { Remove-Item $t.Local -Force }

            & $aws s3 cp "s3://$env:B2_BUCKET/$($t.Key)" $t.Local --endpoint-url $endpoint --no-progress 2>&1 | Write-Host

            if ((Test-Path $t.Local) -and ((Get-Item $t.Local).Length -gt 0)) {
              $sizeMB = [math]::Round((Get-Item $t.Local).Length / 1MB, 2)
              Write-Host "      ✓  Downloaded: $sizeMB MB" -ForegroundColor Green
            } else {
              Write-Host "      ✗  Download failed" -ForegroundColor Red
            }
            Write-Host ""
          }

          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[6/6]  Test Extract with 7-Zip"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Extract Test ────────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"

          # Test 1: telegram-portable.zip
          if (Test-Path "C:\test-telegram.zip") {
            Write-Host "    Extract telegram-portable.zip ..." -ForegroundColor Cyan
            $tmpTg = "C:\extract-telegram"
            if (Test-Path $tmpTg) { Remove-Item $tmpTg -Recurse -Force }
            New-Item -ItemType Directory -Path $tmpTg -Force | Out-Null

            & $sevenZipExe x "C:\test-telegram.zip" "-o$tmpTg" -y -bso0 -bsp0 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $fileCount = (Get-ChildItem $tmpTg -Recurse -File -ErrorAction SilentlyContinue).Count
              Write-Host "      ✓  Extracted: $fileCount files" -ForegroundColor Green

              $exe = Get-ChildItem $tmpTg -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) {
                Write-Host "      ✓  Telegram.exe found: $($exe.FullName)" -ForegroundColor Green
              } else {
                Write-Host "      ⚠  Telegram.exe NOT found" -ForegroundColor Yellow
              }

              Write-Host "      Top-level contents:" -ForegroundColor Gray
              Get-ChildItem $tmpTg -Force | Select-Object -First 15 | ForEach-Object {
                Write-Host "        • $($_.Name)" -ForegroundColor DarkGray
              }
            } else {
              Write-Host "      ✗  7z failed with code $LASTEXITCODE" -ForegroundColor Red
            }
            Write-Host ""
          }

          # Test 2: userdata.zip
          if (Test-Path "C:\test-userdata.zip") {
            Write-Host "    Extract userdata.zip ..." -ForegroundColor Cyan
            $tmpUd = "C:\extract-userdata"
            if (Test-Path $tmpUd) { Remove-Item $tmpUd -Recurse -Force }
            New-Item -ItemType Directory -Path $tmpUd -Force | Out-Null

            & $sevenZipExe x "C:\test-userdata.zip" "-o$tmpUd" -y -bso0 -bsp0 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $fileCount = (Get-ChildItem $tmpUd -Recurse -File -ErrorAction SilentlyContinue).Count
              $totalSize = [math]::Round(((Get-ChildItem $tmpUd -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 2)
              Write-Host "      ✓  Extracted: $fileCount files, $totalSize MB" -ForegroundColor Green

              Write-Host "      Top-level contents:" -ForegroundColor Gray
              Get-ChildItem $tmpUd -Force | Select-Object -First 15 | ForEach-Object {
                Write-Host "        • $($_.Name)" -ForegroundColor DarkGray
              }

              $tgPath = "$tmpUd\AppData\Local\Telegram"
              if (Test-Path $tgPath) {
                Write-Host "      ✓  Telegram folder present" -ForegroundColor Green
                $tdataPath = "$tgPath\tdata"
                if (Test-Path $tdataPath) {
                  $tdataFiles = (Get-ChildItem $tdataPath -Recurse -File -ErrorAction SilentlyContinue).Count
                  $tdataSize  = [math]::Round(((Get-ChildItem $tdataPath -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 2)
                  Write-Host "      ✓  tdata: $tdataFiles files, $tdataSize MB" -ForegroundColor Green
                } else {
                  Write-Host "      ⚠  tdata folder NOT found" -ForegroundColor Yellow
                }
              }
            } else {
              Write-Host "      ✗  7z failed with code $LASTEXITCODE" -ForegroundColor Red
            }
            Write-Host ""
          }

          Write-Host "  └─ Done" -ForegroundColor Green
          Write-Host ""
