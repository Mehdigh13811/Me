          Write-Host "  ║              SERVER IS READY FOR CONNECTION          ║" -ForegroundColor Green
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "  │  IP Address  :  $($tsIP.PadRight(35))│" -ForegroundColor White
          Write-Host "  │  Username    :  runneradmin                          │" -ForegroundColor White
          Write-Host "  │  Password    :  P@ssw0rd!2024                        │" -ForegroundColor White
          Write-Host "  │  Port        :  3389                                 │" -ForegroundColor White
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  Telegram shortcut is available on the Desktop." -ForegroundColor Yellow
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Keep Alive (5h 40m)"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Keep Alive ──────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host ""

          $totalMinutes = 340
          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $h = [math]::Floor($remaining / 60)
            $m = $remaining % 60
            $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
            $tsIP  = "$(& $tsExe ip -4 2>&1)".Trim()
            Write-Host "    [$i/$totalMinutes]  remaining: ${h}h ${m}m   IP: $tsIP" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  └─ Keep Alive finished" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Create Backup"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Backup ──────────────────────────────────────────────┐" -ForegroundColor Magenta
          Write-Host ""

          $userDir     = "C:\Users\runneradmin"
          $stage       = "C:\backup-stage"
          $zipPath     = "C:\userdata.zip"
          $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"
          $tgTdata     = "$userDir\AppData\Local\Telegram\tdata"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          Write-Host "    Copying Telegram tdata (Account Data)..." -ForegroundColor Cyan
          if (Test-Path $tgTdata) {
            $destTdata = "$stage\tdata"
            New-Item -ItemType Directory -Path $destTdata -Force | Out-Null
            $robocopyCmd = "robocopy `"$tgTdata`" `"$destTdata`" /E /NFL /NDL /NJH /NJS /NC /NS /NP /MT:16"
            Invoke-Expression $robocopyCmd | Out-Null
            if ($LASTEXITCODE -ge 8) {
                Write-Host "    ⚠  Robocopy warning (Code: $LASTEXITCODE)" -ForegroundColor Yellow
            } else {
                Write-Host "    ✓  tdata copied successfully" -ForegroundColor Green
            }
          } else {
            Write-Host "    ⓘ  tdata folder not found. Skipping Telegram backup." -ForegroundColor DarkGray
          }

          Write-Host ""
          Write-Host "    Saving desktop layout..." -ForegroundColor Cyan
          $configDir = "$stage\Documents\_rdp-config"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $regFile = "$configDir\desktop-icons.reg"
          $regContent = @("Windows Registry Editor Version 5.00", "")
          $bagsFile = "$env:TEMP\bags.reg"
          reg export "HKCU\Software\Microsoft\Windows\Shell\Bags\1\Desktop" $bagsFile /y 2>&1 | Out-Null
          if (Test-Path $bagsFile) {
            Get-Content $bagsFile | Select-Object -Skip 1 | ForEach-Object { $regContent += $_ }
            Remove-Item $bagsFile -Force -ErrorAction SilentlyContinue
          }
          $regContent | Out-File -FilePath $regFile -Encoding ASCII
          Write-Host "    ✓  Desktop layout saved" -ForegroundColor Green

          Write-Host ""
          Write-Host "    Compressing (Fast Store Mode)..." -ForegroundColor Cyan
          $compressCmd = "& `"$sevenZipExe`" a -tzip `"$zipPath`" `"$stage\*`" -mx0 -mmt=on -y -bso0 -bsp0"
          Invoke-Expression $compressCmd | Out-Null

          if (Test-Path $zipPath) {
            $zipMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
            Write-Host "    ✓  Archive created: $zipMB MB" -ForegroundColor Green
          } else {
            Write-Host "    ✗  Archive creation failed" -ForegroundColor Red
          }

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "  └─ Backup complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Upload Backup"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Upload ──────────────────────────────────────────────┐" -ForegroundColor Magenta
          Write-Host ""

          $zipPath = "C:\userdata.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "    ⓘ  No backup file found" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "  └─ Upload skipped" -ForegroundColor Green
            Write-Host ""
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "    Archive size : $sizeMB MB" -ForegroundColor Cyan

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "    Purging old versions of userdata.zip..." -ForegroundColor Cyan
          $oldVers = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix "userdata.zip" --endpoint-url $endpoint --query "Versions[].VersionId" --output text 2>&1
          if ($oldVers -and $LASTEXITCODE -eq 0 -and $oldVers -ne "None") {
            foreach ($vid in ($oldVers -split '\s+' | Where-Object { $_ })) {
              & $aws s3api delete-object --bucket $env:B2_BUCKET --key "userdata.zip" --version-id $vid --endpoint-url $endpoint 2>&1 | Out-Null
            }
          }
          $oldMarkers = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix "userdata.zip" --endpoint-url $endpoint --query "DeleteMarkers[].VersionId" --output text 2>&1
          if ($oldMarkers -and $LASTEXITCODE -eq 0 -and $oldMarkers -ne "None") {
            foreach ($mid in ($oldMarkers -split '\s+' | Where-Object { $_ })) {
              & $aws s3api delete-object --bucket $env:B2_BUCKET --key "userdata.zip" --version-id $mid --endpoint-url $endpoint 2>&1 | Out-Null
            }
          }
          Write-Host "    ✓  Old versions purged" -ForegroundColor Green

          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "    ↑  attempt $attempt/5 ..." -ForegroundColor DarkGray
            & $aws s3api put-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint --body $zipPath 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }

          Write-Host ""
          if ($uploaded) {
            Write-Host "    ✓  Uploaded to B2" -ForegroundColor Green
          } else {
            Write-Host "    ✗  Upload failed" -ForegroundColor Red
          }

          Write-Host ""
          Write-Host "  └─ Upload complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Run Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "  ║                    RUN SUMMARY                       ║" -ForegroundColor Cyan
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  End Time  :  $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Status    :  ${{ job.status }}" -ForegroundColor Gray
          Write-Host ""
