      - name: "Keep Alive (5 minutes)"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Keep Alive ──────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host ""

          $totalMinutes = 5
          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            Write-Host "    [$i/$totalMinutes]  remaining: ${remaining}m" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  └─ Keep Alive finished" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Create Backup"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Backup ──────────────────────────────────────────────┐" -ForegroundColor Magenta
          Write-Host ""

          $userDir = "C:\Users\runneradmin"
          $stage   = "C:\backup-stage"
          $zipPath = "C:\userdata.zip"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          function Copy-Folder {
            param($Source, $DestName, $Exclude = @())
            if (Test-Path $Source) {
              $dest = Join-Path $stage $DestName
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              if ($Exclude.Count -gt 0) {
                robocopy $Source $dest /E /XD @Exclude /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              } else {
                robocopy $Source $dest /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              }
              $size = (Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    ✓  $($DestName.PadRight(12)) $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            } else {
              Write-Host "    ⓘ  $($DestName.PadRight(12)) not found" -ForegroundColor DarkGray
            }
            $global:LASTEXITCODE = 0
          }

          Write-Host "    User folders:" -ForegroundColor Cyan
          Copy-Folder "$userDir\Desktop"   "Desktop"
          Copy-Folder "$userDir\Documents" "Documents"
          Copy-Folder "$userDir\Downloads" "Downloads"
          Copy-Folder "$userDir\Pictures"  "Pictures"
          Copy-Folder "$userDir\Videos"    "Videos"

          Write-Host ""
          Write-Host "    Application data:" -ForegroundColor Cyan
          $tgSrc = "$userDir\AppData\Local\Telegram"
          if (Test-Path $tgSrc) {
            $tgDest = "$stage\AppData\Local\Telegram"
            New-Item -ItemType Directory -Path $tgDest -Force | Out-Null
            robocopy $tgSrc $tgDest /E `
              /XD "cache" "temp" "user_data" "emoji" "webview" `
              /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $tgDest -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    ✓  Telegram     $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green

            $tdataCheck = "$tgDest\tdata"
            if (Test-Path $tdataCheck) {
              $tdataSize = (Get-ChildItem $tdataCheck -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    ✓  tdata        $([math]::Round($tdataSize/1MB,2)) MB" -ForegroundColor Green
            }
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "    ⓘ  Telegram     not found" -ForegroundColor DarkGray
          }

          $chromeSrc = "$userDir\AppData\Local\Google\Chrome\User Data\Default"
          $chromeDst = "$stage\AppData\Local\Google\Chrome\User Data\Default"
          if (Test-Path $chromeSrc) {
            New-Item -ItemType Directory -Path $chromeDst -Force | Out-Null
            robocopy $chromeSrc $chromeDst /E `
              /XD "Cache" "Code Cache" "GPUCache" "Service Worker" "Application Cache" "Media Cache" "GrShaderCache" "ShaderCache" `
              /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $chromeDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    ✓  Chrome       $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          Write-Host ""
          Write-Host "    Saving desktop layout..." -ForegroundColor Cyan
          $configDir = "$userDir\Documents\_rdp-config"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $regFile = "$configDir\desktop-icons.reg"

          $regContent = @()
          $regContent += "Windows Registry Editor Version 5.00"
          $regContent += ""

          $bagsFile = "$env:TEMP\bags.reg"
          reg export "HKCU\Software\Microsoft\Windows\Shell\Bags\1\Desktop" $bagsFile /y 2>&1 | Out-Null
          if (Test-Path $bagsFile) {
            Get-Content $bagsFile | Select-Object -Skip 1 | ForEach-Object { $regContent += $_ }
            Remove-Item $bagsFile -Force
          }

          $bagMruFile = "$env:TEMP\bagmru.reg"
          reg export "HKCU\Software\Microsoft\Windows\Shell\BagMRU" $bagMruFile /y 2>&1 | Out-Null
          if (Test-Path $bagMruFile) {
            Get-Content $bagMruFile | Select-Object -Skip 1 | ForEach-Object { $regContent += $_ }
            Remove-Item $bagMruFile -Force
          }

          $regContent | Out-File -FilePath $regFile -Encoding ASCII
          Write-Host "    ✓  Desktop layout saved" -ForegroundColor Green

          $regStage = "$stage\Documents\_rdp-config"
          if (-not (Test-Path $regStage)) {
            New-Item -ItemType Directory -Path $regStage -Force | Out-Null
          }
          Copy-Item $regFile "$regStage\desktop-icons.reg" -Force
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "    Compressing archive with 7-Zip (store mode)..." -ForegroundColor Cyan

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = (Get-ChildItem "C:\Program Files\7-Zip\7z.exe","C:\Program Files (x86)\7-Zip\7z.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if (-not (Test-Path $sevenZip)) {
            Write-Host "    ⚠  7-Zip not found — installing..." -ForegroundColor Yellow
            try {
              $sevenZipMsi = "$env:TEMP\7z-installer.exe"
              Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2408-x64.exe" -OutFile $sevenZipMsi -UseBasicParsing -ErrorAction Stop
              Start-Process $sevenZipMsi -ArgumentList "/S" -Wait
              Start-Sleep -Seconds 5
              $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            } catch {
              Write-Host "    ⚠  7-Zip install failed: $_" -ForegroundColor Yellow
            }
          }

          if (Test-Path $sevenZip) {
            Push-Location $stage
            & $sevenZip a -tzip -mx=0 "$zipPath" "*" -bso0 -bsp0 2>&1 | Out-Null
            Pop-Location
            if (Test-Path $zipPath) {
              $zipGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 3)
              Write-Host "    ✓  Archive created: $zipGB GB" -ForegroundColor Green
            }
          } else {
            Write-Host "    ⚠  7-Zip unavailable — using Compress-Archive" -ForegroundColor Yellow
            Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel NoCompression -ErrorAction SilentlyContinue
            if (Test-Path $zipPath) {
              $zipGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 3)
              Write-Host "    ✓  Archive created: $zipGB GB" -ForegroundColor Green
            }
          }

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "  └─ Backup complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Upload Backup"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Upload ──────────────────────────────────────────────┐" -ForegroundColor Magenta
          Write-Host ""

          $zipPath = "C:\userdata.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "    ⓘ  No backup file found" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "  └─ Upload skipped" -ForegroundColor Green
            Write-Host ""
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "    Archive size : $sizeMB MB" -ForegroundColor Cyan

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "    ↑  attempt $attempt/5 ..." -ForegroundColor DarkGray
            & $aws s3 cp $zipPath "s3://$env:B2_BUCKET/userdata.zip" --endpoint-url $endpoint --no-progress
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }

          Write-Host ""
          if ($uploaded) {
            Write-Host "    ✓  Uploaded to B2" -ForegroundColor Green
          } else {
            Write-Host "    ✗  Upload failed" -ForegroundColor Red
          }

          Write-Host ""
          Write-Host "  └─ Upload complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Run Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "  ║                    RUN SUMMARY                       ║" -ForegroundColor Cyan
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  End Time  :  $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Status    :  ${{ job.status }}" -ForegroundColor Gray
          Write-Host ""
