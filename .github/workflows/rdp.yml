name: Windows

on:
  workflow_dispatch:

# ============================================================
# ⚙️  تنظیمات - اینجا ویرایش کن
# ============================================================
env:
  RDP_PASSWORD: "Mehdi@13579@#$"
  TAILSCALE_AUTHKEY: "tskey-auth-kM5gcJDL9B21CNTRL-dBrSevCy22avgAJ5j2kS2aviVpoQNKrF"
  B2_KEY_ID: "0047c90ff6f40880000000003"
  B2_APP_KEY: "K004GCg17BSNz0haTg+BN6lCp0k2/1o"
  B2_BUCKET: "my-files-backup-forrdp"
  B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
  B2_REGION: "us-west-004"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ============================================================
      # STEP 0: Banner
      # ============================================================
      - name: "🚀 Welcome"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "  ║         GITHUB WINDOWS RDP - v5.0                    ║" -ForegroundColor Cyan
          Write-Host "  ║         با اعتبارسنجی کامل پیش از اجرا              ║" -ForegroundColor Cyan
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  🕐 Start time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  🖥️  Hostname   : $env:COMPUTERNAME" -ForegroundColor Gray
          Write-Host "  👤 Runner     : $env:USERNAME" -ForegroundColor Gray
          Write-Host ""

      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: PRE-FLIGHT - بررسی env variables
      # ============================================================
      - name: "🔍 [1/4] بررسی متغیرهای محیطی"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host "  │  بررسی متغیرهای محیطی                              │" -ForegroundColor Yellow
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Yellow
          Write-Host ""

          $required = @(
            @{ Name = "RDP_PASSWORD";      Value = $env:RDP_PASSWORD;      MinLen = 8  },
            @{ Name = "TAILSCALE_AUTHKEY"; Value = $env:TAILSCALE_AUTHKEY; MinLen = 20 },
            @{ Name = "B2_KEY_ID";         Value = $env:B2_KEY_ID;         MinLen = 10 },
            @{ Name = "B2_APP_KEY";        Value = $env:B2_APP_KEY;        MinLen = 10 },
            @{ Name = "B2_BUCKET";         Value = $env:B2_BUCKET;         MinLen = 3  },
            @{ Name = "B2_ENDPOINT";       Value = $env:B2_ENDPOINT;       MinLen = 5  },
            @{ Name = "B2_REGION";         Value = $env:B2_REGION;         MinLen = 3  }
          )

          $missing = @()
          $tooShort = @()

          foreach ($item in $required) {
            $name = $item.Name
            $val  = $item.Value
            $min  = $item.MinLen

            if ([string]::IsNullOrWhiteSpace($val)) {
              Write-Host "  ❌ $name : خالی است" -ForegroundColor Red
              $missing += $name
            }
            elseif ($val.Length -lt $min) {
              Write-Host "  ⚠️  $name : خیلی کوتاه (طول=$($val.Length), حداقل=$min)" -ForegroundColor Red
              $tooShort += $name
            }
            else {
              Write-Host "  ✅ $name : OK (طول=$($val.Length))" -ForegroundColor Green
            }
          }

          Write-Host ""

          if ($missing.Count -gt 0) {
            Write-Host "  ⛔ متغیرهای خالی: $($missing -join ', ')" -ForegroundColor Red
            Write-Host ""
            Write-Host "  راه‌حل: مقادیر را در بخش env فایل yml پر کن." -ForegroundColor Yellow
            exit 1
          }

          if ($tooShort.Count -gt 0) {
            Write-Host "  ⛔ متغیرهای نامعتبر: $($tooShort -join ', ')" -ForegroundColor Red
            exit 1
          }

          # بررسی فرمت‌های خاص
          Write-Host "  ── بررسی فرمت‌ها ──" -ForegroundColor Yellow

          if ($env:TAILSCALE_AUTHKEY -notmatch '^tskey-auth-') {
            Write-Host "  ❌ TAILSCALE_AUTHKEY باید با 'tskey-auth-' شروع شود" -ForegroundColor Red
            exit 1
          }
          Write-Host "  ✅ فرمت Tailscale AuthKey صحیح است" -ForegroundColor Green

          if ($env:B2_KEY_ID -notmatch '^[0-9a-fA-F]+$') {
            Write-Host "  ⚠️  B2_KEY_ID معمولاً فقط hex است - بررسی کن" -ForegroundColor Yellow
          } else {
            Write-Host "  ✅ فرمت B2_KEY_ID صحیح است" -ForegroundColor Green
          }

          if ($env:B2_ENDPOINT -notmatch '^s3\..+\.backblazeb2\.com$') {
            Write-Host "  ⚠️  B2_ENDPOINT فرمت معمول را ندارد" -ForegroundColor Yellow
          } else {
            Write-Host "  ✅ فرمت B2_ENDPOINT صحیح است" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "  ✅ [1/4] همه متغیرها معتبر هستند" -ForegroundColor Green
          Write-Host ""

      # ============================================================
      # STEP 2: PRE-FLIGHT - تست اتصال Backblaze B2
      # ============================================================
      - name: "🔍 [2/4] تست اتصال Backblaze B2"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host "  │  تست اتصال و احراز هویت Backblaze B2                │" -ForegroundColor Yellow
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Yellow
          Write-Host ""

          # نصب AWS CLI
          Write-Host "  📦 نصب AWS CLI..." -ForegroundColor Cyan
          $installer = "$env:TEMP\AWSCLIV2.msi"
          try {
            if (-not (Test-Path "C:\Program Files\Amazon\AWSCLIV2\aws.exe")) {
              Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile $installer -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i $installer /quiet /norestart" -Wait
              Start-Sleep -Seconds 5
            }
            $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
            if (-not (Test-Path $aws)) {
              throw "AWS CLI نصب نشد"
            }
            $ver = & $aws --version 2>&1
            Write-Host "  ✅ AWS CLI آماده: $ver" -ForegroundColor Green
          } catch {
            Write-Host "  ❌ نصب AWS CLI ناموفق: $_" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION

          $endpoint = "https://$env:B2_ENDPOINT"

          # تست ۱: دسترسی به خود باکِت
          Write-Host "  🔐 تست دسترسی به باکِت '$env:B2_BUCKET'..." -ForegroundColor Cyan
          $head = & $aws s3api head-bucket --bucket $env:B2_BUCKET --endpoint-url $endpoint 2>&1
          $headExit = $LASTEXITCODE

          if ($headExit -ne 0) {
            Write-Host "  ❌ دسترسی به باکِت ناموفق!" -ForegroundColor Red
            Write-Host ""
            Write-Host "  جزئیات خطا:" -ForegroundColor Yellow
            Write-Host "  $head" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  دلایل محتمل:" -ForegroundColor Yellow
            Write-Host "    • نام باکِت اشتباه است (به حروف بزرگ/کوچک حساس است)" -ForegroundColor Gray
            Write-Host "    • کلید B2 به این باکِت دسترسی ندارد" -ForegroundColor Gray
            Write-Host "    • B2_KEY_ID یا B2_APP_KEY اشتباه است" -ForegroundColor Gray
            Write-Host "    • کلید revoke شده یا منقضی شده" -ForegroundColor Gray
            Write-Host "    • B2_ENDPOINT اشتباه است" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  💡 نکته: کلید B2 باید حداقل دسترسی read+write به این باکِت داشته باشد." -ForegroundColor Yellow
            exit 1
          }
          Write-Host "  ✅ دسترسی به باکِت OK" -ForegroundColor Green

          # تست ۲: دسترسی نوشتن
          Write-Host ""
          Write-Host "  📝 تست دسترسی نوشتن..." -ForegroundColor Cyan
          $testFile = "$env:TEMP\b2-test-$(Get-Random).txt"
          "connectivity test" | Out-File -FilePath $testFile -Encoding utf8
          $testKey = "_connectivity-test.txt"

          $put = & $aws s3 cp $testFile "s3://$env:B2_BUCKET/$testKey" --endpoint-url $endpoint --no-progress 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  ❌ دسترسی نوشتن ندارد!" -ForegroundColor Red
            Write-Host ""
            Write-Host "  جزئیات: $put" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  💡 کلید B2 باید دسترسی writeFiles داشته باشد." -ForegroundColor Yellow
            Remove-Item $testFile -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "  ✅ دسترسی نوشتن OK" -ForegroundColor Green

          Write-Host "  🗑️  پاکسازی فایل تست..." -ForegroundColor Cyan
          & $aws s3 rm "s3://$env:B2_BUCKET/$testKey" --endpoint-url $endpoint 2>&1 | Out-Null
          Remove-Item $testFile -Force -ErrorAction SilentlyContinue

          # تست ۳: بررسی وجود بکاپ قبلی
          Write-Host ""
          Write-Host "  📂 بررسی وجود بکاپ قبلی..." -ForegroundColor Cyan
          $obj = & $aws s3api head-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "  ✅ بکاپ قبلی پیدا شد" -ForegroundColor Green
          } else {
            Write-Host "  ℹ️  بکاپ قبلی وجود ندارد (اولین اجرا)" -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "  ✅ [2/4] Backblaze B2 کاملاً آماده است" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 3: PRE-FLIGHT - تست اتصال Tailscale
      # ============================================================
      - name: "🔍 [3/4] تست اتصال Tailscale"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host "  │  تست اتصال و احراز هویت Tailscale                   │" -ForegroundColor Yellow
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Yellow
          Write-Host ""

          # بررسی دسترسی به سرور Tailscale با TCP (نه HTTP - چون HEAD رو بلاک می‌کنه)
          Write-Host "  🌐 بررسی دسترسی به Tailscale..." -ForegroundColor Cyan
          try {
            $tcp = New-Object System.Net.Sockets.TcpClient
            $connect = $tcp.BeginConnect("login.tailscale.com", 443, $null, $null)
            $success = $connect.AsyncWaitHandle.WaitOne(10000, $false)
            if (-not $success) {
              throw "اتصال TCP timeout شد"
            }
            $tcp.EndConnect($connect)
            $tcp.Close()
            Write-Host "  ✅ Tailscale در دسترس است (TCP:443)" -ForegroundColor Green
          } catch {
            Write-Host "  ❌ اتصال به Tailscale ناموفق: $_" -ForegroundColor Red
            exit 1
          }

          # دانلود نصب‌کننده
          Write-Host ""
          Write-Host "  📦 دانلود نصب‌کننده Tailscale..." -ForegroundColor Cyan
          $msiPath = "C:\tailscale.msi"
          try {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            $sizeMB = [math]::Round((Get-Item $msiPath).Length / 1MB, 2)
            Write-Host "  ✅ دانلود شد: $sizeMB MB" -ForegroundColor Green
          } catch {
            Write-Host "  ❌ دانلود ناموفق: $_" -ForegroundColor Red
            exit 1
          }

          # نصب
          Write-Host ""
          Write-Host "  🔧 نصب Tailscale..." -ForegroundColor Cyan
          Start-Process msiexec -ArgumentList "/i $msiPath /quiet /norestart" -Wait
          Start-Sleep -Seconds 15

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            Write-Host "  ❌ Tailscale نصب نشد!" -ForegroundColor Red
            exit 1
          }
          Write-Host "  ✅ Tailscale نصب شد" -ForegroundColor Green

          # اتصال با AuthKey
          Write-Host ""
          Write-Host "  🔐 تست اعتبار AuthKey و اتصال..." -ForegroundColor Cyan
          $hostname = "github-rdp-$(Get-Random -Maximum 9999)"
          $connectOutput = & $tsExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=$hostname --accept-routes 2>&1
          $connectExit = $LASTEXITCODE

          if ($connectExit -ne 0) {
            Write-Host "  ❌ اتصال Tailscale ناموفق!" -ForegroundColor Red
            Write-Host ""
            Write-Host "  خروجی:" -ForegroundColor Yellow
            Write-Host "  $connectOutput" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  دلایل محتمل:" -ForegroundColor Yellow
            Write-Host "    • AuthKey نامعتبر یا revoke شده" -ForegroundColor Gray
            Write-Host "    • AuthKey منقضی شده" -ForegroundColor Gray
            Write-Host "    • AuthKey به device limit رسیده" -ForegroundColor Gray
            exit 1
          }

          Start-Sleep -Seconds 15

          # تأیید اتصال و IP
          $tsIP = & $tsExe ip -4 2>&1
          if ([string]::IsNullOrWhiteSpace($tsIP) -or $tsIP -match 'error') {
            Write-Host "  ❌ Tailscale IP دریافت نشد" -ForegroundColor Red
            Write-Host "  $tsIP" -ForegroundColor Gray
            exit 1
          }

          $tsStatus = & $tsExe status 2>&1

          Write-Host ""
          Write-Host "  ✅ [3/4] Tailscale متصل شد" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Green
          Write-Host "  │              اطلاعات اتصال Tailscale                 │" -ForegroundColor Green
          Write-Host "  ├──────────────────────────────────────────────────────┤" -ForegroundColor Green
          Write-Host "  │  IP       : $tsIP" -ForegroundColor White
          Write-Host "  │  Hostname : $hostname" -ForegroundColor White
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Green
          Write-Host ""
          Write-Host "  وضعیت کامل:" -ForegroundColor Cyan
          Write-Host $tsStatus -ForegroundColor Gray
          Write-Host ""

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8
          "TAILSCALE_HOSTNAME=$hostname" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 4: PRE-FLIGHT - خلاصه بررسی‌ها
      # ============================================================
      - name: "🔍 [4/4] خلاصه بررسی‌های اولیه"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "  ║          ✅ همه بررسی‌ها موفق بودند                  ║" -ForegroundColor Green
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ✅ [1/4] متغیرهای محیطی معتبر" -ForegroundColor Green
          Write-Host "  ✅ [2/4] Backblaze B2 متصل و آماده" -ForegroundColor Green
          Write-Host "  ✅ [3/4] Tailscale متصل و آماده" -ForegroundColor Green
          Write-Host "  ✅ [4/4] شروع فرآیند اصلی..." -ForegroundColor Green
          Write-Host ""
          Write-Host "  🕐 زمان: $(Get-Date -Format 'HH:mm:ss')" -ForegroundColor Gray
          Write-Host ""

      # ============================================================
      # STEP 5: Enable RDP
      # ============================================================
      - name: "🖥️ فعال‌سازی RDP"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── فعال‌سازی Remote Desktop ──" -ForegroundColor Yellow
          try {
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction Stop
            Write-Host "  ✅ fDenyTSConnections = 0" -ForegroundColor Green
            Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
            Write-Host "  ✅ فایروال RDP فعال شد" -ForegroundColor Green
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -ErrorAction Stop
            Write-Host "  ✅ NLA غیرفعال شد" -ForegroundColor Green
            Write-Host ""
            Write-Host "  ✅ RDP کاملاً فعال است" -ForegroundColor Green
          } catch {
            Write-Host "  ❌ خطا در RDP: $_" -ForegroundColor Red
            exit 1
          }
          Write-Host ""

      # ============================================================
      # STEP 6: Setup Administrator
      # ============================================================
      - name: "👤 تنظیم حساب Administrator"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── تنظیم Administrator ──" -ForegroundColor Yellow
          try {
            $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
            try {
              Enable-LocalUser -Name "Administrator" -ErrorAction Stop
              Set-LocalUser -Name "Administrator" -Password $Password -PasswordNeverExpires $true
              Write-Host "  ✅ Administrator فعال شد" -ForegroundColor Green
            } catch {
              New-LocalUser -Name "Administrator" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
              Write-Host "  ✅ Administrator ساخته شد" -ForegroundColor Green
            }
            Add-LocalGroupMember -Group "Administrators" -Member "Administrator" -ErrorAction SilentlyContinue
            net user runneradmin $env:RDP_PASSWORD 2>$null | Out-Null
            Write-Host "  ✅ پسورد تنظیم شد" -ForegroundColor Green
          } catch {
            Write-Host "  ❌ خطا: $_" -ForegroundColor Red
            exit 1
          }
          Write-Host ""

      # ============================================================
      # STEP 7: Restore Backup
      # ============================================================
      - name: "📥 بازیابی بکاپ از B2"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── بازیابی بکاپ ──" -ForegroundColor Magenta

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          & $aws s3api head-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  ℹ️  بکاپ قبلی وجود ندارد - اولین اجرا" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "  📥 دانلود بکاپ..." -ForegroundColor Cyan
          $backupZip = "C:\userdata.zip"
          $downloaded = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              & $aws s3 cp "s3://$env:B2_BUCKET/userdata.zip" $backupZip --endpoint-url $endpoint --no-progress
              if ((Test-Path $backupZip) -and ((Get-Item $backupZip).Length -gt 0)) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Host "  ⚠️  تلاش $attempt ناموفق" -ForegroundColor Yellow
              Start-Sleep -Seconds 10
            }
          }

          if ($downloaded) {
            $sizeMB = [math]::Round((Get-Item $backupZip).Length / 1MB, 2)
            Write-Host "  ✅ دانلود شد: $sizeMB MB" -ForegroundColor Green
            Write-Host "  📦 استخراج..." -ForegroundColor Cyan
            Expand-Archive -Path $backupZip -DestinationPath "C:\" -Force -ErrorAction SilentlyContinue
            Write-Host "  ✅ بازیابی کامل شد" -ForegroundColor Green
            Remove-Item $backupZip -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "  ❌ دانلود بکاپ ناموفق" -ForegroundColor Red
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 8: نمایش اطلاعات اتصال
      # ============================================================
      - name: "📢 اطلاعات اتصال"
        shell: pwsh
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4 2>&1

          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "  ║           🎉 سرور RDP آماده است!                    ║" -ForegroundColor Green
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ┌──────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "  │              اطلاعات اتصال RDP                       │" -ForegroundColor Cyan
          Write-Host "  ├──────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "  │  🖥️  IP       : $tsIP" -ForegroundColor White
          Write-Host "  │  👤 Username : Administrator" -ForegroundColor White
          Write-Host "  │  🔑 Password : (در فایل yml)" -ForegroundColor White
          Write-Host "  │  🔌 Port     : 3389" -ForegroundColor White
          Write-Host "  └──────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 9: Keep Alive (5 hours)
      # ============================================================
      - name: "⏳ نگه‌داشتن سرور فعال (5 ساعت)"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── Keep Alive شروع شد ──" -ForegroundColor Cyan
          Write-Host "  ⏱️  مدت: 300 دقیقه" -ForegroundColor Cyan
          Write-Host ""

          $totalMinutes = 300
          $startTime = Get-Date

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $elapsed = (Get-Date) - $startTime
            $remaining = $totalMinutes - $i
            $h = [math]::Floor($remaining / 60)
            $m = $remaining % 60

            if ($i % 5 -eq 0 -or $i -eq 1) {
              $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
              $tsIP = & $tsExe ip -4 2>&1
              Write-Host "  [$i/$totalMinutes] ⏱️  گذشته: $([math]::Floor($elapsed.TotalMinutes))min | باقی: ${h}h ${m}m | IP: $tsIP" -ForegroundColor Gray
            } else {
              Write-Host "  [$i/$totalMinutes] باقی‌مانده: ${h}h ${m}m" -ForegroundColor DarkGray
            }
          }
          Write-Host ""
          Write-Host "  ✅ Keep Alive تمام شد" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 10: Create Backup Zip
      # ============================================================
      - name: "📦 ساخت فایل بکاپ"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── ساخت بکاپ ──" -ForegroundColor Magenta

          $userDir = "C:\Users\Administrator"
          $stage   = "C:\backup-stage"
          $zipPath = "C:\userdata.zip"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          function Copy-Folder {
            param($Source, $DestName, $Exclude = @())
            if (Test-Path $Source) {
              $dest = Join-Path $stage $DestName
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              if ($Exclude.Count -gt 0) {
                robocopy $Source $dest /E /XD @Exclude /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              } else {
                robocopy $Source $dest /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              }
              $size = (Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    ✅ $DestName : $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            } else {
              Write-Host "    ⏭️  $Source یافت نشد" -ForegroundColor DarkGray
            }
            $global:LASTEXITCODE = 0
          }

          Copy-Folder "$userDir\Desktop"   "Desktop"
          Copy-Folder "$userDir\Documents" "Documents"
          Copy-Folder "$userDir\Downloads" "Downloads"
          Copy-Folder "$userDir\Pictures"  "Pictures"
          Copy-Folder "$userDir\Videos"    "Videos"

          $chromeSrc = "$userDir\AppData\Local\Google\Chrome\User Data\Default"
          $chromeDst = "$stage\AppData\Local\Google\Chrome\User Data\Default"
          if (Test-Path $chromeSrc) {
            New-Item -ItemType Directory -Path $chromeDst -Force | Out-Null
            robocopy $chromeSrc $chromeDst /E `
              /XD "Cache" "Code Cache" "GPUCache" "Service Worker" "Application Cache" "Media Cache" "GrShaderCache" "ShaderCache" `
              /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $chromeDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    ✅ Chrome: $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          $tgSrc = "$userDir\AppData\Roaming\Telegram Desktop\tdata"
          $tgDst = "$stage\AppData\Roaming\Telegram Desktop\tdata"
          if (Test-Path $tgSrc) {
            New-Item -ItemType Directory -Path $tgDst -Force | Out-Null
            robocopy $tgSrc $tgDst /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $tgDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    ✅ Telegram: $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          Write-Host ""
          Write-Host "  🗜️  در حال فشرده‌سازی..." -ForegroundColor Yellow
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal -ErrorAction SilentlyContinue

          if (Test-Path $zipPath) {
            $zipGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 3)
            Write-Host "  ✅ بکاپ ساخته شد: $zipGB GB" -ForegroundColor Green

            if ($zipGB -gt 10) {
              Write-Host "  ⚠️  بیشتر از 10GB - حذف Downloads..." -ForegroundColor Red
              Remove-Item "$stage\Downloads" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zipPath -Force
              Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal
              Write-Host "  ✅ حجم جدید: $([math]::Round((Get-Item $zipPath).Length/1GB,3)) GB" -ForegroundColor Green
            }
          }

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 11: Upload to B2
      # ============================================================
      - name: "☁️  آپلود بکاپ به B2"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ── آپلود به B2 ──" -ForegroundColor Magenta

          $zipPath = "C:\userdata.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "  ⏭️  فایل بکاپی وجود ندارد" -ForegroundColor Yellow            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "  📊 حجم: $sizeMB MB" -ForegroundColor Cyan

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "  🔄 تلاش $attempt/5..." -ForegroundColor Cyan
            & $aws s3 cp $zipPath "s3://$env:B2_BUCKET/userdata.zip" --endpoint-url $endpoint --no-progress
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }

          if ($uploaded) {
            Write-Host "  ✅ آپلود با موفقیت انجام شد" -ForegroundColor Green
          } else {
            Write-Host "  ❌ آپلود پس از 5 تلاش ناموفق" -ForegroundColor Red
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 12: Summary
      # ============================================================
      - name: "📊 خلاصه نهایی"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "  ║                  خلاصه اجرا                          ║" -ForegroundColor Cyan
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  🕐 پایان    : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  📌 وضعیت   : ${{ job.status }}" -ForegroundColor Gray
          Write-Host ""
