name: Windows

on:
  workflow_dispatch:

env:
  RDP_PASSWORD: 'P@ssw0rd!2024'
  TAILSCALE_AUTHKEY: "tskey-auth-kM5gcJDL9B21CNTRL-dBrSevCy22avgAJ5j2kS2aviVpoQNKrF"
  B2_KEY_ID: "0047c90ff6f40880000000003"
  B2_APP_KEY: "K004GCg17BSNz0haTg+BN6lCp0k2/1o"
  B2_BUCKET: "my-files-backup-forrdp"
  B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
  B2_REGION: "us-west-004"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: "Welcome"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host "         GITHUB WINDOWS RDP - v12.1" -ForegroundColor Cyan
          Write-Host "         User: MehdiRDP" -ForegroundColor Cyan
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  Start time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Hostname   : $env:COMPUTERNAME" -ForegroundColor Gray
          Write-Host ""

      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "[1/3] Validate Environment Variables"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Validating environment variables..." -ForegroundColor Yellow
          Write-Host ""

          $required = @(
            @{ Name = "RDP_PASSWORD";      Value = $env:RDP_PASSWORD;      MinLen = 8  },
            @{ Name = "TAILSCALE_AUTHKEY"; Value = $env:TAILSCALE_AUTHKEY; MinLen = 20 },
            @{ Name = "B2_KEY_ID";         Value = $env:B2_KEY_ID;         MinLen = 10 },
            @{ Name = "B2_APP_KEY";        Value = $env:B2_APP_KEY;        MinLen = 10 },
            @{ Name = "B2_BUCKET";         Value = $env:B2_BUCKET;         MinLen = 3  },
            @{ Name = "B2_ENDPOINT";       Value = $env:B2_ENDPOINT;       MinLen = 5  },
            @{ Name = "B2_REGION";         Value = $env:B2_REGION;         MinLen = 3  }
          )

          $missing = @()
          foreach ($item in $required) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              Write-Host "  [MISSING] $($item.Name)" -ForegroundColor Red
              $missing += $item.Name
            } elseif ($item.Value.Length -lt $item.MinLen) {
              Write-Host "  [INVALID] $($item.Name) too short" -ForegroundColor Red
              $missing += $item.Name
            } else {
              Write-Host "  [OK] $($item.Name)" -ForegroundColor Green
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "  FAILED: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }

          if ($env:TAILSCALE_AUTHKEY -notmatch '^tskey-auth-') {
            Write-Host "  [FAIL] Tailscale AuthKey format invalid" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "  [1/3] All variables valid" -ForegroundColor Green
          Write-Host ""

      - name: "[2/3] Test B2 + Install AWS CLI"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Testing Backblaze B2..." -ForegroundColor Yellow
          Write-Host ""

          Write-Host "  Installing AWS CLI..." -ForegroundColor Cyan
          $installer = "$env:TEMP\AWSCLIV2.msi"
          try {
            if (-not (Test-Path "C:\Program Files\Amazon\AWSCLIV2\aws.exe")) {
              Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile $installer -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i $installer /quiet /norestart" -Wait
              Start-Sleep -Seconds 5
            }
            Write-Host "  [OK] AWS CLI ready" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] AWS CLI install: $_" -ForegroundColor Red
            exit 1
          }

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "  Testing bucket access..." -ForegroundColor Cyan
          $head = & $aws s3api head-bucket --bucket $env:B2_BUCKET --endpoint-url $endpoint 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  [FAIL] Cannot access bucket: $head" -ForegroundColor Red
            exit 1
          }
          Write-Host "  [OK] Bucket access works" -ForegroundColor Green

          Write-Host "  Testing write access..." -ForegroundColor Cyan
          $testFile = "$env:TEMP\b2-test.txt"
          "test" | Out-File -FilePath $testFile -Encoding utf8
          & $aws s3 cp $testFile "s3://$env:B2_BUCKET/_connectivity.txt" --endpoint-url $endpoint --no-progress 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  [FAIL] No write access" -ForegroundColor Red
            exit 1
          }
          & $aws s3 rm "s3://$env:B2_BUCKET/_connectivity.txt" --endpoint-url $endpoint 2>&1 | Out-Null
          Remove-Item $testFile -Force -ErrorAction SilentlyContinue
          Write-Host "  [OK] Write access works" -ForegroundColor Green

          Write-Host ""
          Write-Host "  Listing B2 contents:" -ForegroundColor Cyan
          $listResult = & $aws s3 ls "s3://$env:B2_BUCKET/" --endpoint-url $endpoint 2>&1
          if ($listResult) {
            Write-Host "$listResult" -ForegroundColor Gray
          } else {
            Write-Host "  (bucket is empty)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  [2/3] B2 ready" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[3/3] Install Tailscale"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Installing Tailscale..." -ForegroundColor Yellow
          Write-Host ""

          $msiPath = "C:\tailscale.msi"
          try {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            Write-Host "  [OK] Downloaded" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] Download failed: $_" -ForegroundColor Red
            exit 1
          }

          Start-Process msiexec -ArgumentList "/i $msiPath /quiet /norestart" -Wait
          Start-Sleep -Seconds 15

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            Write-Host "  [FAIL] Tailscale not installed" -ForegroundColor Red
            exit 1
          }
          Write-Host "  [OK] Tailscale installed" -ForegroundColor Green

          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Write-Host "  Connecting with AuthKey..." -ForegroundColor Cyan
          $hostname = "github-rdp-$(Get-Random -Maximum 9999)"
          $connected = $false
          $tsIP = ""

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "  Attempt $attempt/6..." -ForegroundColor Cyan
            & $tsExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=$hostname --accept-routes 2>&1 | Out-Null
            Start-Sleep -Seconds 10
            $tsIP = "$(& $tsExe ip -4 2>&1)".Trim()
            if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') {
              $connected = $true
              break
            }
          }

          if (-not $connected) {
            Write-Host "  [FAIL] Tailscale didn't connect" -ForegroundColor Red
            Write-Host "$(& $tsExe status 2>&1)" -ForegroundColor Gray
            exit 1
          }

          Write-Host "  [OK] Tailscale connected - IP: $tsIP" -ForegroundColor Green
          Write-Host ""

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Enable RDP"
        shell: pwsh
        run: |
          Write-Host "  Enabling RDP..." -ForegroundColor Yellow
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue
          Write-Host "  [OK] RDP enabled" -ForegroundColor Green
          Write-Host ""

      - name: "Relax Password Policy"
        shell: pwsh
        run: |
          Write-Host "  Relaxing password policy..." -ForegroundColor Yellow
          try {
            secedit /export /cfg C:\secpol.cfg 2>&1 | Out-Null
            $content = Get-Content C:\secpol.cfg
            $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
            $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 8'
            $content = $content -replace 'PasswordHistorySize = \d+', 'PasswordHistorySize = 0'
            $content | Out-File C:\secpol.cfg -Encoding ASCII
            secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY 2>&1 | Out-Null
            Remove-Item C:\secpol.cfg -Force -ErrorAction SilentlyContinue
            Write-Host "  [OK] Password policy relaxed" -ForegroundColor Green
          } catch {
            Write-Host "  [WARN] Could not relax policy: $_" -ForegroundColor Yellow
          }
          gpupdate /force 2>&1 | Out-Null
          Write-Host ""

      - name: "Create MehdiRDP User"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Magenta
          Write-Host "  Creating user: MehdiRDP" -ForegroundColor Magenta
          Write-Host "  ======================================================" -ForegroundColor Magenta
          Write-Host ""

          $username = "MehdiRDP"
          $plainPassword = $env:RDP_PASSWORD

          Write-Host "  Password length: $($plainPassword.Length)" -ForegroundColor Gray

          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "  User exists - updating password" -ForegroundColor Yellow
            net user $username $plainPassword 2>&1 | Out-Null
            Write-Host "  [OK] Password updated" -ForegroundColor Green
          } else {
            Write-Host "  Creating user via net user..." -ForegroundColor Cyan
            $result = net user $username $plainPassword /add /y 2>&1
            Write-Host "  $result" -ForegroundColor Gray
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  [FAIL] Could not create user" -ForegroundColor Red
              exit 1
            }
            Write-Host "  [OK] User created" -ForegroundColor Green
          }

          net user $username /expires:never 2>&1 | Out-Null
          net user $username /active:yes 2>&1 | Out-Null

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Write-Host "  [OK] Added to Administrators" -ForegroundColor Green

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Write-Host "  [OK] Added to Remote Desktop Users" -ForegroundColor Green

          $userProfilePath = "C:\Users\$username"
          if (-not (Test-Path $userProfilePath)) {
            New-Item -ItemType Directory -Path $userProfilePath -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\Desktop" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\Documents" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\Downloads" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\Pictures" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\Videos" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\AppData" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\AppData\Roaming" -Force | Out-Null
            New-Item -ItemType Directory -Path "$userProfilePath\AppData\Local" -Force | Out-Null
            Write-Host "  [OK] Profile folders created" -ForegroundColor Green
          }

          Write-Host ""
          Get-LocalUser -Name $username | Format-Table Name, Enabled, LastLogon -AutoSize
          Write-Host ""
          Write-Host "  [OK] MehdiRDP user is ready" -ForegroundColor Green
          Write-Host ""

      - name: "Ensure Telegram Portable on B2"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Ensuring Telegram Portable zip on B2..." -ForegroundColor Magenta
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"
          $tgZipName = "telegram-portable.zip"
          $localTgZip = "C:\telegram-portable.zip"

          Write-Host "  Checking B2 for $tgZipName..." -ForegroundColor Cyan
          & $aws s3api head-object --bucket $env:B2_BUCKET --key $tgZipName --endpoint-url $endpoint 2>$null | Out-Null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "  [OK] Telegram Portable already on B2" -ForegroundColor Green
          } else {
            Write-Host "  [INFO] Not on B2 - downloading from telegram.org" -ForegroundColor Yellow
            try {
              Invoke-WebRequest -Uri "https://telegram.org/dl/desktop/win64_portable" `
                -OutFile $localTgZip -UseBasicParsing -ErrorAction Stop
              $sizeMB = [math]::Round((Get-Item $localTgZip).Length / 1MB, 2)
              Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green
            } catch {
              Write-Host "  [FAIL] Download failed: $_" -ForegroundColor Red
              $global:LASTEXITCODE = 0
              exit 0
            }

            Write-Host "  Uploading to B2..." -ForegroundColor Cyan
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $aws s3 cp $localTgZip "s3://$env:B2_BUCKET/$tgZipName" --endpoint-url $endpoint --no-progress
              if ($LASTEXITCODE -eq 0) {
                Write-Host "  [OK] Uploaded to B2" -ForegroundColor Green
                break
              }
              Start-Sleep -Seconds 10
            }
          }

          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Restore User Data from B2"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Restoring user data from B2..." -ForegroundColor Magenta
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          & $aws s3api head-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  [INFO] No user data backup found (first run)" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "  Downloading userdata.zip..." -ForegroundColor Cyan
          $backupZip = "C:\userdata.zip"
          $downloaded = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $aws s3 cp "s3://$env:B2_BUCKET/userdata.zip" $backupZip --endpoint-url $endpoint --no-progress
            if ((Test-Path $backupZip) -and ((Get-Item $backupZip).Length -gt 0)) {
              $downloaded = $true
              break
            }
            Start-Sleep -Seconds 10
          }

          if (-not $downloaded) {
            Write-Host "  [FAIL] Download failed" -ForegroundColor Red
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $backupZip).Length / 1MB, 2)
          Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green

          Write-Host "  Extracting to C:\Users\MehdiRDP ..." -ForegroundColor Cyan
          try {
            Expand-Archive -Path $backupZip -DestinationPath "C:\Users\MehdiRDP" -Force -ErrorAction Stop
            Write-Host "  [OK] Extracted to C:\Users\MehdiRDP" -ForegroundColor Green
          } catch {
            Write-Host "  [WARN] Extract error: $_" -ForegroundColor Yellow
          }
          Remove-Item $backupZip -Force -ErrorAction SilentlyContinue

          $mehdiDesktop = "C:\Users\MehdiRDP\Desktop"
          $restoredTg = "$mehdiDesktop\Telegram"
          if (Test-Path $restoredTg) {
            Write-Host "  [OK] Telegram folder restored to MehdiRDP Desktop" -ForegroundColor Green
            $tdataPath = "$restoredTg\tdata"
            if (Test-Path $tdataPath) {
              $tdataSize = (Get-ChildItem $tdataPath -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "  [OK] tdata: $([math]::Round($tdataSize/1MB,2)) MB" -ForegroundColor Green
            }
          }

          $regFile = "C:\Users\MehdiRDP\Documents\_rdp-config\desktop-icons.reg"
          if (Test-Path $regFile) {
            Write-Host "  Restoring desktop icon layout..." -ForegroundColor Cyan
            reg import $regFile 2>&1 | Out-Null
            Write-Host "  [OK] Desktop layout restored" -ForegroundColor Green
          }

          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Setup Telegram on MehdiRDP Desktop"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Setting up Telegram on MehdiRDP's Desktop..." -ForegroundColor Magenta
          Write-Host ""

          $userDir = "C:\Users\MehdiRDP"
          $desktop = "$userDir\Desktop"

          if (-not (Test-Path $desktop)) {
            New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          }

          Write-Host "  Desktop path: $desktop" -ForegroundColor Gray
          Write-Host "  Current Desktop contents:" -ForegroundColor Gray
          Get-ChildItem $desktop -Force -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "    - $($_.Name)" -ForegroundColor DarkGray
          }
          Write-Host ""

          $tgDir = "$desktop\Telegram"
          $tgExe = "$tgDir\Telegram.exe"
          $tgZip = "C:\telegram-portable.zip"

          if (Test-Path $tgExe) {
            Write-Host "  [OK] Telegram already exists at: $tgExe" -ForegroundColor Green
          } else {
            Write-Host "  Downloading Telegram from B2..." -ForegroundColor Cyan

            $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
            $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
            $env:AWS_DEFAULT_REGION    = $env:B2_REGION
            $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
            $endpoint = "https://$env:B2_ENDPOINT"

            & $aws s3 cp "s3://$env:B2_BUCKET/telegram-portable.zip" $tgZip --endpoint-url $endpoint --no-progress

            if (-not (Test-Path $tgZip) -or ((Get-Item $tgZip).Length -eq 0)) {
              Write-Host "  [FAIL] Could not download from B2" -ForegroundColor Red
              $global:LASTEXITCODE = 0
              exit 0
            }

            $sizeMB = [math]::Round((Get-Item $tgZip).Length / 1MB, 2)
            Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green

            if (-not (Test-Path $tgDir)) {
              New-Item -ItemType Directory -Path $tgDir -Force | Out-Null
            }

            Write-Host "  Extracting..." -ForegroundColor Cyan
            try {
              Expand-Archive -Path $tgZip -DestinationPath $tgDir -Force -ErrorAction Stop
              Write-Host "  [OK] Extract successful" -ForegroundColor Green
            } catch {
              Write-Host "  [FAIL] Extract failed: $_" -ForegroundColor Red
              $global:LASTEXITCODE = 0
              exit 0
            }
            Remove-Item $tgZip -Force -ErrorAction SilentlyContinue

            if (-not (Test-Path $tgExe)) {
              $found = Get-ChildItem $tgDir -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $tgExe = $found.FullName
                Write-Host "  [OK] Found at: $tgExe" -ForegroundColor Green
              } else {
                Write-Host "  [FAIL] Telegram.exe not found" -ForegroundColor Red
                $global:LASTEXITCODE = 0
                exit 0
              }
            }
          }

          $shortcut = "$desktop\Telegram.lnk"
          if (-not (Test-Path $shortcut)) {
            Write-Host "  Creating shortcut..." -ForegroundColor Cyan
            try {
              $ws = New-Object -ComObject WScript.Shell
              $sc = $ws.CreateShortcut($shortcut)
              $sc.TargetPath = $tgExe
              $sc.WorkingDirectory = Split-Path $tgExe
              $sc.IconLocation = "$tgExe,0"
              $sc.Save()
              Write-Host "  [OK] Shortcut created" -ForegroundColor Green
            } catch {
              Write-Host "  [WARN] Shortcut failed: $_" -ForegroundColor Yellow
            }
          } else {
            Write-Host "  [OK] Shortcut exists" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "  -- Final Desktop contents --" -ForegroundColor Cyan
          Get-ChildItem $desktop -Force -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "    - $($_.Name)" -ForegroundColor White
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Display Connection Info"
        shell: pwsh
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIP = "$(& $tsExe ip -4 2>&1)".Trim()

          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host "                RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Cyan
          Write-Host "  IP       : $tsIP" -ForegroundColor White
          Write-Host "  Username : MehdiRDP" -ForegroundColor White
          Write-Host "  Password : P@ssw0rd!2024" -ForegroundColor White
          Write-Host "  Port     : 3389" -ForegroundColor White
          Write-Host "  ------------------------------------------------------" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  Telegram is on Desktop - click to open" -ForegroundColor Yellow
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Keep Server Alive (5 hours)"
        if: always()
        shell: pwsh
        run: |
          Write-Host "  Keep Alive - 300 minutes" -ForegroundColor Cyan
          Write-Host ""

          $totalMinutes = 300
          $startTime = Get-Date

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $h = [math]::Floor($remaining / 60)
            $m = $remaining % 60

            if ($i % 5 -eq 0 -or $i -eq 1) {
              $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
              $tsIP = "$(& $tsExe ip -4 2>&1)".Trim()
              Write-Host "  [$i/$totalMinutes] remaining: ${h}h ${m}m | IP: $tsIP" -ForegroundColor Gray
            } else {
              Write-Host "  [$i/$totalMinutes] remaining: ${h}h ${m}m" -ForegroundColor DarkGray
            }
          }
          Write-Host ""
          Write-Host "  [OK] Keep Alive finished" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Create Backup"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  Creating backup for MehdiRDP..." -ForegroundColor Magenta
          Write-Host ""

          $userDir = "C:\Users\MehdiRDP"
          $stage   = "C:\backup-stage"
          $zipPath = "C:\userdata.zip"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          function Copy-Folder {
            param($Source, $DestName, $Exclude = @())
            if (Test-Path $Source) {
              $dest = Join-Path $stage $DestName
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              if ($Exclude.Count -gt 0) {
                robocopy $Source $dest /E /XD @Exclude /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              } else {
                robocopy $Source $dest /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              }
              $size = (Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    [OK] $DestName : $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            } else {
              Write-Host "    [SKIP] $Source not found" -ForegroundColor DarkGray
            }
            $global:LASTEXITCODE = 0
          }

          Write-Host "  Backing up MehdiRDP's data..." -ForegroundColor Gray
          Copy-Folder "$userDir\Desktop"   "Desktop"
          Copy-Folder "$userDir\Documents" "Documents"
          Copy-Folder "$userDir\Downloads" "Downloads"
          Copy-Folder "$userDir\Pictures"  "Pictures"
          Copy-Folder "$userDir\Videos"    "Videos"

          $chromeSrc = "$userDir\AppData\Local\Google\Chrome\User Data\Default"
          $chromeDst = "$stage\AppData\Local\Google\Chrome\User Data\Default"
          if (Test-Path $chromeSrc) {
            New-Item -ItemType Directory -Path $chromeDst -Force | Out-Null
            robocopy $chromeSrc $chromeDst /E `
              /XD "Cache" "Code Cache" "GPUCache" "Service Worker" "Application Cache" "Media Cache" "GrShaderCache" "ShaderCache" `
              /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $chromeDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    [OK] Chrome: $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          Write-Host ""
          Write-Host "  Saving desktop icon layout..." -ForegroundColor Cyan
          $configDir = "$userDir\Documents\_rdp-config"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $regFile = "$configDir\desktop-icons.reg"
          reg export "HKCU\Software\Microsoft\Windows\Shell\Bags\1\Desktop" $regFile /y 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "  [OK] Desktop layout saved" -ForegroundColor Green
            $regStage = "$stage\Documents\_rdp-config"
            if (-not (Test-Path $regStage)) {
              New-Item -ItemType Directory -Path $regStage -Force | Out-Null
            }
            Copy-Item $regFile "$regStage\desktop-icons.reg" -Force
          }
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "  Checking Telegram tdata..." -ForegroundColor Cyan
          $tdataCheck = "$userDir\Desktop\Telegram\tdata"
          if (Test-Path $tdataCheck) {
            $tdataSize = (Get-ChildItem $tdataCheck -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "  [OK] tdata: $([math]::Round($tdataSize/1MB,2)) MB" -ForegroundColor Green
          } else {
            Write-Host "  [INFO] No tdata yet" -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "  Compressing..." -ForegroundColor Yellow
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal -ErrorAction SilentlyContinue

          if (Test-Path $zipPath) {
            $zipGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 3)
            Write-Host "  [OK] Backup created: $zipGB GB" -ForegroundColor Green

            if ($zipGB -gt 10) {
              Write-Host "  [WARN] Over 10GB - removing Downloads" -ForegroundColor Red
              Remove-Item "$stage\Downloads" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zipPath -Force
              Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal
              Write-Host "  [OK] New size: $([math]::Round((Get-Item $zipPath).Length/1GB,3)) GB" -ForegroundColor Green
            }
          }

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Upload Backup to B2"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "  Uploading userdata.zip to B2..." -ForegroundColor Magenta

          $zipPath = "C:\userdata.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "  [SKIP] No backup file" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "  Size: $sizeMB MB" -ForegroundColor Cyan

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "  Attempt $attempt/5..." -ForegroundColor Cyan
            & $aws s3 cp $zipPath "s3://$env:B2_BUCKET/userdata.zip" --endpoint-url $endpoint --no-progress
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }

          if ($uploaded) {
            Write-Host "  [OK] Upload successful" -ForegroundColor Green
          } else {
            Write-Host "  [FAIL] Upload failed" -ForegroundColor Red
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "Final Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host "                    RUN SUMMARY" -ForegroundColor Cyan
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  End time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Status   : ${{ job.status }}" -ForegroundColor Gray
          Write-Host ""
