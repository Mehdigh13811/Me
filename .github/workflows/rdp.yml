name: Windows

on:
  workflow_dispatch:

env:
  RDP_PASSWORD: "Mehdi@13579@#$"
  TAILSCALE_AUTHKEY: "tskey-auth-kM5gcJDL9B21CNTRL-dBrSevCy22avgAJ5j2kS2aviVpoQNKrF"
  B2_KEY_ID: "0047c90ff6f40880000000003"
  B2_APP_KEY: "K004GCg17BSNz0haTg+BN6lCp0k2/1o"
  B2_BUCKET: "my-files-backup-forrdp"
  B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
  B2_REGION: "us-west-004"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ============================================================
      # STEP 0: Welcome
      # ============================================================
      - name: "Welcome"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host "         GITHUB WINDOWS RDP - v6.0" -ForegroundColor Cyan
          Write-Host "         Full Pre-flight Validation" -ForegroundColor Cyan
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  Start time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Hostname   : $env:COMPUTERNAME" -ForegroundColor Gray
          Write-Host "  Runner     : $env:USERNAME" -ForegroundColor Gray
          Write-Host ""

      - name: "Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: Validate environment variables
      # ============================================================
      - name: "[1/4] Validate Environment Variables"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host "  Validating environment variables" -ForegroundColor Yellow
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host ""

          $required = @(
            @{ Name = "RDP_PASSWORD";      Value = $env:RDP_PASSWORD;      MinLen = 8  },
            @{ Name = "TAILSCALE_AUTHKEY"; Value = $env:TAILSCALE_AUTHKEY; MinLen = 20 },
            @{ Name = "B2_KEY_ID";         Value = $env:B2_KEY_ID;         MinLen = 10 },
            @{ Name = "B2_APP_KEY";        Value = $env:B2_APP_KEY;        MinLen = 10 },
            @{ Name = "B2_BUCKET";         Value = $env:B2_BUCKET;         MinLen = 3  },
            @{ Name = "B2_ENDPOINT";       Value = $env:B2_ENDPOINT;       MinLen = 5  },
            @{ Name = "B2_REGION";         Value = $env:B2_REGION;         MinLen = 3  }
          )

          $missing = @()
          $tooShort = @()

          foreach ($item in $required) {
            $name = $item.Name
            $val  = $item.Value
            $min  = $item.MinLen

            if ([string]::IsNullOrWhiteSpace($val)) {
              Write-Host "  [MISSING] $name is empty" -ForegroundColor Red
              $missing += $name
            }
            elseif ($val.Length -lt $min) {
              Write-Host "  [INVALID] $name too short (len=$($val.Length), min=$min)" -ForegroundColor Red
              $tooShort += $name
            }
            else {
              Write-Host "  [OK] $name (len=$($val.Length))" -ForegroundColor Green
            }
          }

          Write-Host ""

          if ($missing.Count -gt 0) {
            Write-Host "  FAILED: Missing variables: $($missing -join ', ')" -ForegroundColor Red
            Write-Host "  Fix: Fill values in the env section of the yml file." -ForegroundColor Yellow
            exit 1
          }

          if ($tooShort.Count -gt 0) {
            Write-Host "  FAILED: Invalid variables: $($tooShort -join ', ')" -ForegroundColor Red
            exit 1
          }

          Write-Host "  -- Format checks --" -ForegroundColor Yellow

          if ($env:TAILSCALE_AUTHKEY -notmatch '^tskey-auth-') {
            Write-Host "  [FAIL] TAILSCALE_AUTHKEY must start with 'tskey-auth-'" -ForegroundColor Red
            exit 1
          }
          Write-Host "  [OK] Tailscale AuthKey format is valid" -ForegroundColor Green

          if ($env:B2_KEY_ID -notmatch '^[0-9a-fA-F]+$') {
            Write-Host "  [WARN] B2_KEY_ID is usually hex only" -ForegroundColor Yellow
          } else {
            Write-Host "  [OK] B2_KEY_ID format is valid" -ForegroundColor Green
          }

          if ($env:B2_ENDPOINT -notmatch '^s3\..+\.backblazeb2\.com$') {
            Write-Host "  [WARN] B2_ENDPOINT format is unusual" -ForegroundColor Yellow
          } else {
            Write-Host "  [OK] B2_ENDPOINT format is valid" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "  [1/4] All variables are valid" -ForegroundColor Green
          Write-Host ""

      # ============================================================
      # STEP 2: Backblaze B2 connectivity test
      # ============================================================
      - name: "[2/4] Test Backblaze B2 Connection"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host "  Testing Backblaze B2 connection" -ForegroundColor Yellow
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host ""

          Write-Host "  Installing AWS CLI..." -ForegroundColor Cyan
          $installer = "$env:TEMP\AWSCLIV2.msi"
          try {
            if (-not (Test-Path "C:\Program Files\Amazon\AWSCLIV2\aws.exe")) {
              Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile $installer -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i $installer /quiet /norestart" -Wait
              Start-Sleep -Seconds 5
            }
            $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
            if (-not (Test-Path $aws)) {
              throw "AWS CLI installation failed"
            }
            $ver = & $aws --version 2>&1
            Write-Host "  [OK] AWS CLI: $ver" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] AWS CLI install: $_" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION

          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "  Testing bucket access: '$env:B2_BUCKET'..." -ForegroundColor Cyan
          $head = & $aws s3api head-bucket --bucket $env:B2_BUCKET --endpoint-url $endpoint 2>&1
          $headExit = $LASTEXITCODE

          if ($headExit -ne 0) {
            Write-Host "  [FAIL] Cannot access bucket!" -ForegroundColor Red
            Write-Host ""
            Write-Host "  Error details:" -ForegroundColor Yellow
            Write-Host "  $head" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  Possible causes:" -ForegroundColor Yellow
            Write-Host "    - Bucket name is wrong (case-sensitive)" -ForegroundColor Gray
            Write-Host "    - B2 key has no access to this bucket" -ForegroundColor Gray
            Write-Host "    - B2_KEY_ID or B2_APP_KEY is wrong" -ForegroundColor Gray
            Write-Host "    - Key is revoked or expired" -ForegroundColor Gray
            Write-Host "    - B2_ENDPOINT is wrong" -ForegroundColor Gray
            exit 1
          }
          Write-Host "  [OK] Bucket access works" -ForegroundColor Green

          Write-Host ""
          Write-Host "  Testing write access..." -ForegroundColor Cyan
          $testFile = "$env:TEMP\b2-test-$(Get-Random).txt"
          "connectivity test" | Out-File -FilePath $testFile -Encoding utf8
          $testKey = "_connectivity-test.txt"

          $put = & $aws s3 cp $testFile "s3://$env:B2_BUCKET/$testKey" --endpoint-url $endpoint --no-progress 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  [FAIL] No write access!" -ForegroundColor Red
            Write-Host "  Details: $put" -ForegroundColor Gray
            Remove-Item $testFile -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "  [OK] Write access works" -ForegroundColor Green

          Write-Host "  Cleaning up test file..." -ForegroundColor Cyan
          & $aws s3 rm "s3://$env:B2_BUCKET/$testKey" --endpoint-url $endpoint 2>&1 | Out-Null
          Remove-Item $testFile -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "  Checking for existing backup..." -ForegroundColor Cyan
          $obj = & $aws s3api head-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "  [OK] Previous backup found" -ForegroundColor Green
          } else {
            Write-Host "  [INFO] No previous backup (first run)" -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "  [2/4] Backblaze B2 is ready" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 3: Tailscale connectivity test
      # ============================================================
      - name: "[3/4] Test Tailscale Connection"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host "  Testing Tailscale connection" -ForegroundColor Yellow
          Write-Host "  ------------------------------------------------------" -ForegroundColor Yellow
          Write-Host ""

          Write-Host "  Checking Tailscale reachability..." -ForegroundColor Cyan
          try {
            $tcp = New-Object System.Net.Sockets.TcpClient
            $connect = $tcp.BeginConnect("login.tailscale.com", 443, $null, $null)
            $success = $connect.AsyncWaitHandle.WaitOne(10000, $false)
            if (-not $success) {
              throw "TCP connect timed out"
            }
            $tcp.EndConnect($connect)
            $tcp.Close()
            Write-Host "  [OK] Tailscale is reachable (TCP:443)" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] Tailscale unreachable: $_" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "  Downloading Tailscale installer..." -ForegroundColor Cyan
          $msiPath = "C:\tailscale.msi"
          try {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            $sizeMB = [math]::Round((Get-Item $msiPath).Length / 1MB, 2)
            Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] Download failed: $_" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "  Installing Tailscale..." -ForegroundColor Cyan
          Start-Process msiexec -ArgumentList "/i $msiPath /quiet /norestart" -Wait
          Start-Sleep -Seconds 15

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            Write-Host "  [FAIL] Tailscale not installed!" -ForegroundColor Red
            exit 1
          }
          Write-Host "  [OK] Tailscale installed" -ForegroundColor Green

          Write-Host ""
          Write-Host "  Connecting with AuthKey..." -ForegroundColor Cyan
          $hostname = "github-rdp-$(Get-Random -Maximum 9999)"
          $connectOutput = & $tsExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=$hostname --accept-routes 2>&1
          $connectExit = $LASTEXITCODE

          if ($connectExit -ne 0) {
            Write-Host "  [FAIL] Tailscale connection failed!" -ForegroundColor Red
            Write-Host ""
            Write-Host "  Output:" -ForegroundColor Yellow
            Write-Host "  $connectOutput" -ForegroundColor Gray
            Write-Host ""
            Write-Host "  Possible causes:" -ForegroundColor Yellow
            Write-Host "    - AuthKey invalid or revoked" -ForegroundColor Gray
            Write-Host "    - AuthKey expired" -ForegroundColor Gray
            Write-Host "    - AuthKey reached device limit" -ForegroundColor Gray
            exit 1
          }

          Start-Sleep -Seconds 15

          $tsIP = & $tsExe ip -4 2>&1
          if ([string]::IsNullOrWhiteSpace($tsIP) -or $tsIP -match 'error') {
            Write-Host "  [FAIL] Tailscale IP not received" -ForegroundColor Red
            Write-Host "  $tsIP" -ForegroundColor Gray
            exit 1
          }

          $tsStatus = & $tsExe status 2>&1

          Write-Host ""
          Write-Host "  [3/4] Tailscale connected" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Green
          Write-Host "                Tailscale Connection Info" -ForegroundColor Green
          Write-Host "  ------------------------------------------------------" -ForegroundColor Green
          Write-Host "  IP       : $tsIP" -ForegroundColor White
          Write-Host "  Hostname : $hostname" -ForegroundColor White
          Write-Host "  ------------------------------------------------------" -ForegroundColor Green
          Write-Host ""
          Write-Host "  Full status:" -ForegroundColor Cyan
          Write-Host $tsStatus -ForegroundColor Gray
          Write-Host ""

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8
          "TAILSCALE_HOSTNAME=$hostname" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 4: Pre-flight summary
      # ============================================================
      - name: "[4/4] Pre-flight Summary"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host "           All pre-flight checks passed" -ForegroundColor Green
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  [1/4] Environment variables valid" -ForegroundColor Green
          Write-Host "  [2/4] Backblaze B2 connected" -ForegroundColor Green
          Write-Host "  [3/4] Tailscale connected" -ForegroundColor Green
          Write-Host "  [4/4] Starting main process..." -ForegroundColor Green
          Write-Host ""
          Write-Host "  Time: $(Get-Date -Format 'HH:mm:ss')" -ForegroundColor Gray
          Write-Host ""

      # ============================================================
      # STEP 5: Enable RDP
      # ============================================================
      - name: "Enable RDP"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Enabling Remote Desktop --" -ForegroundColor Yellow
          try {
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction Stop
            Write-Host "  [OK] fDenyTSConnections = 0" -ForegroundColor Green
            Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
            Write-Host "  [OK] RDP firewall rule enabled" -ForegroundColor Green
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -ErrorAction Stop
            Write-Host "  [OK] NLA disabled" -ForegroundColor Green
            Write-Host ""
            Write-Host "  [OK] RDP fully enabled" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] RDP setup error: $_" -ForegroundColor Red
            exit 1
          }
          Write-Host ""

      # ============================================================
      # STEP 6: Setup Administrator account
      # ============================================================
      - name: "Setup Administrator Account"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Configuring Administrator --" -ForegroundColor Yellow
          try {
            $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
            try {
              Enable-LocalUser -Name "Administrator" -ErrorAction Stop
              Set-LocalUser -Name "Administrator" -Password $Password -PasswordNeverExpires $true
              Write-Host "  [OK] Administrator enabled" -ForegroundColor Green
            } catch {
              New-LocalUser -Name "Administrator" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
              Write-Host "  [OK] Administrator created" -ForegroundColor Green
            }
            Add-LocalGroupMember -Group "Administrators" -Member "Administrator" -ErrorAction SilentlyContinue
            net user runneradmin $env:RDP_PASSWORD 2>$null | Out-Null
            Write-Host "  [OK] Password set" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] Error: $_" -ForegroundColor Red
            exit 1
          }
          Write-Host ""

      # ============================================================
      # STEP 7: Restore backup from B2
      # ============================================================
      - name: "Restore Backup from B2"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Restoring backup --" -ForegroundColor Magenta

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          & $aws s3api head-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "  [INFO] No previous backup - first run" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "  Downloading backup..." -ForegroundColor Cyan
          $backupZip = "C:\userdata.zip"
          $downloaded = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              & $aws s3 cp "s3://$env:B2_BUCKET/userdata.zip" $backupZip --endpoint-url $endpoint --no-progress
              if ((Test-Path $backupZip) -and ((Get-Item $backupZip).Length -gt 0)) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Host "  [WARN] Attempt $attempt failed" -ForegroundColor Yellow
              Start-Sleep -Seconds 10
            }
          }

          if ($downloaded) {
            $sizeMB = [math]::Round((Get-Item $backupZip).Length / 1MB, 2)
            Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green
            Write-Host "  Extracting..." -ForegroundColor Cyan
            Expand-Archive -Path $backupZip -DestinationPath "C:\" -Force -ErrorAction SilentlyContinue
            Write-Host "  [OK] Restore complete" -ForegroundColor Green
            Remove-Item $backupZip -Force -ErrorAction SilentlyContinue

            $regFile = "C:\Users\Administrator\Documents\_rdp-config\desktop-icons.reg"
            if (Test-Path $regFile) {
              Write-Host "  Restoring desktop icon layout..." -ForegroundColor Cyan
              reg import $regFile 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "  [OK] Desktop icon layout restored" -ForegroundColor Green
              }
              $global:LASTEXITCODE = 0
            }
          } else {
            Write-Host "  [FAIL] Backup download failed" -ForegroundColor Red
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 8: Install Telegram Desktop
      # ============================================================
      - name: "Install Telegram Desktop"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Installing Telegram Desktop --" -ForegroundColor Cyan

          $tgPath = "C:\Users\Administrator\AppData\Roaming\Telegram Desktop\Telegram.exe"
          if (Test-Path $tgPath) {
            Write-Host "  [OK] Telegram already installed" -ForegroundColor Green
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "  Downloading Telegram installer..." -ForegroundColor Cyan
          $tgInstaller = "C:\telegram-setup.exe"
          try {
            Invoke-WebRequest -Uri "https://telegram.org/dl/desktop/win64" -OutFile $tgInstaller -UseBasicParsing -ErrorAction Stop
            $sizeMB = [math]::Round((Get-Item $tgInstaller).Length / 1MB, 2)
            Write-Host "  [OK] Downloaded: $sizeMB MB" -ForegroundColor Green
          } catch {
            Write-Host "  [FAIL] Download failed: $_" -ForegroundColor Red
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "  Installing silently..." -ForegroundColor Cyan
          try {
            Start-Process $tgInstaller -ArgumentList "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES /DIR=`"C:\Users\Administrator\AppData\Roaming\Telegram Desktop`"" -Wait
            Start-Sleep -Seconds 10
            Write-Host "  [OK] Telegram installed" -ForegroundColor Green
          } catch {
            Write-Host "  [WARN] Silent install may have failed: $_" -ForegroundColor Yellow
          }

          Remove-Item $tgInstaller -Force -ErrorAction SilentlyContinue

          $desktopLnk = "C:\Users\Administrator\Desktop\Telegram.lnk"
          if ((Test-Path $tgPath) -and (-not (Test-Path $desktopLnk))) {
            $ws = New-Object -ComObject WScript.Shell
            $sc = $ws.CreateShortcut($desktopLnk)
            $sc.TargetPath = $tgPath
            $sc.Save()
            Write-Host "  [OK] Desktop shortcut created" -ForegroundColor Green
          }

          Write-Host ""
          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 9: Display connection info
      # ============================================================
      - name: "Connection Info"
        shell: pwsh
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIP = & $tsExe ip -4 2>&1

          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host "                RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "  ======================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  ------------------------------------------------------" -ForegroundColor Cyan
          Write-Host "                RDP Connection Info" -ForegroundColor Cyan
          Write-Host "  ------------------------------------------------------" -ForegroundColor Cyan
          Write-Host "  IP       : $tsIP" -ForegroundColor White
          Write-Host "  Username : Administrator" -ForegroundColor White
          Write-Host "  Password : (see yml file)" -ForegroundColor White
          Write-Host "  Port     : 3389" -ForegroundColor White
          Write-Host "  ------------------------------------------------------" -ForegroundColor Cyan
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 10: Keep Alive (5 hours)
      # ============================================================
      - name: "Keep Server Alive (5 hours)"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Keep Alive started --" -ForegroundColor Cyan
          Write-Host "  Duration: 300 minutes" -ForegroundColor Cyan
          Write-Host ""

          $totalMinutes = 300
          $startTime = Get-Date

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $elapsed = (Get-Date) - $startTime
            $remaining = $totalMinutes - $i
            $h = [math]::Floor($remaining / 60)
            $m = $remaining % 60

            if ($i % 5 -eq 0 -or $i -eq 1) {
              $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
              $tsIP = & $tsExe ip -4 2>&1
              Write-Host "  [$i/$totalMinutes] elapsed: $([math]::Floor($elapsed.TotalMinutes))min | remaining: ${h}h ${m}m | IP: $tsIP" -ForegroundColor Gray
            } else {
              Write-Host "  [$i/$totalMinutes] remaining: ${h}h ${m}m" -ForegroundColor DarkGray
            }
          }
          Write-Host ""
          Write-Host "  [OK] Keep Alive finished" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 11: Create backup zip
      # ============================================================
      - name: "Create Backup Zip"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Creating backup --" -ForegroundColor Magenta

          $userDir = "C:\Users\Administrator"
          $stage   = "C:\backup-stage"
          $zipPath = "C:\userdata.zip"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          function Copy-Folder {
            param($Source, $DestName, $Exclude = @())
            if (Test-Path $Source) {
              $dest = Join-Path $stage $DestName
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              if ($Exclude.Count -gt 0) {
                robocopy $Source $dest /E /XD @Exclude /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              } else {
                robocopy $Source $dest /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
              }
              $size = (Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    [OK] $DestName : $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            } else {
              Write-Host "    [SKIP] $Source not found" -ForegroundColor DarkGray
            }
            $global:LASTEXITCODE = 0
          }

          Copy-Folder "$userDir\Desktop"   "Desktop"
          Copy-Folder "$userDir\Documents" "Documents"
          Copy-Folder "$userDir\Downloads" "Downloads"
          Copy-Folder "$userDir\Pictures"  "Pictures"
          Copy-Folder "$userDir\Videos"    "Videos"

          $chromeSrc = "$userDir\AppData\Local\Google\Chrome\User Data\Default"
          $chromeDst = "$stage\AppData\Local\Google\Chrome\User Data\Default"
          if (Test-Path $chromeSrc) {
            New-Item -ItemType Directory -Path $chromeDst -Force | Out-Null
            robocopy $chromeSrc $chromeDst /E `
              /XD "Cache" "Code Cache" "GPUCache" "Service Worker" "Application Cache" "Media Cache" "GrShaderCache" "ShaderCache" `
              /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $chromeDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    [OK] Chrome: $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          $tgSrc = "$userDir\AppData\Roaming\Telegram Desktop\tdata"
          $tgDst = "$stage\AppData\Roaming\Telegram Desktop\tdata"
          if (Test-Path $tgSrc) {
            New-Item -ItemType Directory -Path $tgDst -Force | Out-Null
            robocopy $tgSrc $tgDst /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
            $size = (Get-ChildItem $tgDst -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host "    [OK] Telegram: $([math]::Round($size/1MB,2)) MB" -ForegroundColor Green
            $global:LASTEXITCODE = 0
          }

          Write-Host ""
          Write-Host "  Saving desktop icon layout..." -ForegroundColor Cyan
          $configDir = "$userDir\Documents\_rdp-config"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $regFile = "$configDir\desktop-icons.reg"
          reg export "HKCU\Software\Microsoft\Windows\Shell\Bags\1\Desktop" $regFile /y 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "  [OK] Desktop layout saved" -ForegroundColor Green
            $regStage = "$stage\Documents\_rdp-config"
            if (-not (Test-Path $regStage)) {
              New-Item -ItemType Directory -Path $regStage -Force | Out-Null
            }
            Copy-Item $regFile "$regStage\desktop-icons.reg" -Force
          }
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "  Compressing..." -ForegroundColor Yellow
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal -ErrorAction SilentlyContinue

          if (Test-Path $zipPath) {
            $zipGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 3)
            Write-Host "  [OK] Backup created: $zipGB GB" -ForegroundColor Green

            if ($zipGB -gt 10) {
              Write-Host "  [WARN] Over 10GB - removing Downloads..." -ForegroundColor Red
              Remove-Item "$stage\Downloads" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zipPath -Force
              Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force -CompressionLevel Optimal
              Write-Host "  [OK] New size: $([math]::Round((Get-Item $zipPath).Length/1GB,3)) GB" -ForegroundColor Green
            }
          }

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 12: Upload to B2
      # ============================================================
      - name: "Upload Backup to B2"
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  -- Uploading to B2 --" -ForegroundColor Magenta

          $zipPath = "C:\userdata.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "  [SKIP] No backup file" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "  Size: $sizeMB MB" -ForegroundColor Cyan

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "  Attempt $attempt/5..." -ForegroundColor Cyan
            & $aws s3 cp $zipPath "s3://$env:B2_BUCKET/userdata.zip" --endpoint-url $endpoint --no-progress
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds 15
          }

          if ($uploaded) {
            Write-Host "  [OK] Upload successful" -ForegroundColor Green
          } else {
            Write-Host "  [FAIL] Upload failed after 5 attempts" -ForegroundColor Red
          }
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      # ============================================================
      # STEP 13: Final summary
      # ============================================================
      - name: "Final Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host "                    RUN SUMMARY" -ForegroundColor Cyan
          Write-Host "  ======================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  End time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
          Write-Host "  Status   : ${{ job.status }}" -ForegroundColor Gray
          Write-Host ""
