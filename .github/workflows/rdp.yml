name: Windows RDP Server

on:
  workflow_dispatch:

env:
  RDP_PASSWORD: 'P@ssw0rd!2024'
  TAILSCALE_AUTHKEY: "tskey-auth-kM5gcJDL9B21CNTRL-dBrSevCy22avgAJ5j2kS2aviVpoQNKrF"
  B2_KEY_ID: "0041168d3dcfddd0000000001"
  B2_APP_KEY: "K004NwAr2sPVEVY4/8UipGukwJKF2k0"
  B2_BUCKET: "my-rdp-backup"
  B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
  B2_REGION: "us-west-004"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 370

    steps:
      - name: "Banner"
        shell: pwsh
        run: |
          $c = 'Cyan'
          $g = 'Gray'
          Write-Host ""
          Write-Host "  ╔══════════════════════════════════════════════════════╗" -ForegroundColor $c
          Write-Host "  ║           GITHUB WINDOWS RDP SERVER  v16.5           ║" -ForegroundColor $c
          Write-Host "  ╠══════════════════════════════════════════════════════╣" -ForegroundColor $c
          Write-Host "  ║   User      :  runneradmin                           ║" -ForegroundColor $c
          Write-Host "  ║   Storage   :  Backblaze B2                          ║" -ForegroundColor $c
          Write-Host "  ╚══════════════════════════════════════════════════════╝" -ForegroundColor $c
          Write-Host ""
          Write-Host "  Start    :  $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor $g
          Write-Host "  Hostname :  $env:COMPUTERNAME" -ForegroundColor $g
          Write-Host ""

      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "[1/9]  Validate Configuration"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Configuration Check ────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $required = @(
            @{ Name = "RDP_PASSWORD";      Value = $env:RDP_PASSWORD;      MinLen = 8  },
            @{ Name = "TAILSCALE_AUTHKEY"; Value = $env:TAILSCALE_AUTHKEY; MinLen = 20 },
            @{ Name = "B2_KEY_ID";         Value = $env:B2_KEY_ID;         MinLen = 10 },
            @{ Name = "B2_APP_KEY";        Value = $env:B2_APP_KEY;        MinLen = 10 },
            @{ Name = "B2_BUCKET";         Value = $env:B2_BUCKET;         MinLen = 3  },
            @{ Name = "B2_ENDPOINT";       Value = $env:B2_ENDPOINT;       MinLen = 5  },
            @{ Name = "B2_REGION";         Value = $env:B2_REGION;         MinLen = 3  }
          )

          $failed = @()
          foreach ($item in $required) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              Write-Host "    ✗  $($item.Name.PadRight(20)) missing" -ForegroundColor Red
              $failed += $item.Name
            } elseif ($item.Value.Length -lt $item.MinLen) {
              Write-Host "    ✗  $($item.Name.PadRight(20)) too short" -ForegroundColor Red
              $failed += $item.Name
            } else {
              Write-Host "    ✓  $($item.Name.PadRight(20)) ok" -ForegroundColor Green
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "  └─ Failed: $($failed -join ', ')" -ForegroundColor Red
            Write-Host ""
            exit 1
          }

          if ($env:TAILSCALE_AUTHKEY -notmatch '^tskey-auth-') {
            Write-Host "    ✗  Tailscale AuthKey format invalid" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "  └─ All checks passed" -ForegroundColor Green
          Write-Host ""

      - name: "[2/9]  Prepare AWS CLI and Verify B2"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Storage Preparation ────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "    Installing AWS CLI..." -ForegroundColor Cyan

          $installer = "$env:TEMP\AWSCLIV2.msi"
          try {
            if (-not (Test-Path "C:\Program Files\Amazon\AWSCLIV2\aws.exe")) {
              Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile $installer -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i $installer /quiet /norestart" -Wait
              Start-Sleep -Seconds 5
            }
            Write-Host "    ✓  AWS CLI ready" -ForegroundColor Green
          } catch {
            Write-Host "    ✗  Install failed: $_" -ForegroundColor Red
            exit 1
          }

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "    Verifying bucket access..." -ForegroundColor Cyan
          $head = & $aws s3api head-bucket --bucket $env:B2_BUCKET --endpoint-url $endpoint 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "    ✗  Cannot access bucket: $head" -ForegroundColor Red
            exit 1
          }
          Write-Host "    ✓  Bucket accessible" -ForegroundColor Green

          Write-Host "    Verifying write permissions..." -ForegroundColor Cyan
          $testFile = "$env:TEMP\b2-test.txt"
          "test" | Out-File -FilePath $testFile -Encoding utf8
          & $aws s3api put-object --bucket $env:B2_BUCKET --key "_connectivity.txt" --endpoint-url $endpoint --body $testFile 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "    ✗  No write access" -ForegroundColor Red
            exit 1
          }

          Write-Host "    Purging all versions of _connectivity.txt..." -ForegroundColor Cyan
          $versions = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix "_connectivity.txt" --endpoint-url $endpoint --query "Versions[].VersionId" --output text 2>&1
          if ($versions -and $LASTEXITCODE -eq 0 -and $versions -ne "None") {
            foreach ($vid in ($versions -split '\s+' | Where-Object { $_ })) {
              & $aws s3api delete-object --bucket $env:B2_BUCKET --key "_connectivity.txt" --version-id $vid --endpoint-url $endpoint 2>&1 | Out-Null
            }
          }
          $markers = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix "_connectivity.txt" --endpoint-url $endpoint --query "DeleteMarkers[].VersionId" --output text 2>&1
          if ($markers -and $LASTEXITCODE -eq 0 -and $markers -ne "None") {
            foreach ($mid in ($markers -split '\s+' | Where-Object { $_ })) {
              & $aws s3api delete-object --bucket $env:B2_BUCKET --key "_connectivity.txt" --version-id $mid --endpoint-url $endpoint 2>&1 | Out-Null
            }
          }
          Remove-Item $testFile -Force -ErrorAction SilentlyContinue
          Write-Host "    ✓  Write access confirmed & test file purged" -ForegroundColor Green

          Write-Host ""
          Write-Host "    Bucket contents:" -ForegroundColor Cyan
          $listResult = & $aws s3 ls "s3://$env:B2_BUCKET/" --endpoint-url $endpoint 2>&1
          if ($listResult) {
            $listResult | ForEach-Object { Write-Host "      $_" -ForegroundColor Gray }
          } else {
            Write-Host "      (empty)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  └─ Storage ready" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[3/9]  Install and Connect Tailscale"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Network Setup ──────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "    Installing Tailscale..." -ForegroundColor Cyan

          $msiPath = "C:\tailscale.msi"
          try {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            Write-Host "    ✓  Downloaded" -ForegroundColor Green
          } catch {
            Write-Host "    ✗  Download failed: $_" -ForegroundColor Red
            exit 1
          }

          Start-Process msiexec -ArgumentList "/i $msiPath /quiet /norestart" -Wait
          Start-Sleep -Seconds 15

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            Write-Host "    ✗  Installation failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "    ✓  Installed" -ForegroundColor Green

          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Write-Host "    Connecting to network..." -ForegroundColor Cyan
          $hostname  = "github-rdp-$(Get-Random -Maximum 9999)"
          $connected = $false
          $tsIP      = ""

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "      attempt $attempt/6 ..." -ForegroundColor DarkGray
            & $tsExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=$hostname --accept-routes 2>&1 | Out-Null
            Start-Sleep -Seconds 10
            $tsIP = "$(& $tsExe ip -4 2>&1)".Trim()
            if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') {
              $connected = $true
              break
            }
          }

          if (-not $connected) {
            Write-Host "    ✗  Connection failed" -ForegroundColor Red
            Write-Host "$(& $tsExe status 2>&1)" -ForegroundColor Gray
            exit 1
          }

          Write-Host "    ✓  Connected — IP: $tsIP" -ForegroundColor Green
          Write-Host ""
          Write-Host "  └─ Network ready" -ForegroundColor Green
          Write-Host ""

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath "$env:GITHUB_ENV" -Append -Encoding utf8

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[4/9]  Enable Remote Desktop"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Remote Desktop Setup ───────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          Write-Host "    Enabling RDP service..." -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue
          Write-Host "    ✓  RDP enabled" -ForegroundColor Green

          Write-Host "    Opening firewall rules..." -ForegroundColor Cyan
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Write-Host "    ✓  Firewall configured" -ForegroundColor Green

          Write-Host "    Adjusting authentication..." -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue
          Write-Host "    ✓  Authentication relaxed" -ForegroundColor Green

          Write-Host ""
          Write-Host "  └─ RDP ready" -ForegroundColor Green
          Write-Host ""

      - name: "[5/9]  Configure User Account"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ User Account ───────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          Write-Host "    Adjusting password policy..." -ForegroundColor Cyan
          try {
            secedit /export /cfg C:\secpol.cfg 2>&1 | Out-Null
            $content = Get-Content C:\secpol.cfg
            $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
            $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 8'
            $content = $content -replace 'PasswordHistorySize = \d+', 'PasswordHistorySize = 0'
            $content | Out-File C:\secpol.cfg -Encoding ASCII
            secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY 2>&1 | Out-Null
            Remove-Item C:\secpol.cfg -Force -ErrorAction SilentlyContinue
            Write-Host "    ✓  Policy relaxed" -ForegroundColor Green
          } catch {
            Write-Host "    ⚠  Could not relax policy: $_" -ForegroundColor Yellow
          }
          gpupdate /force 2>&1 | Out-Null

          $username      = "runneradmin"
          $plainPassword = $env:RDP_PASSWORD

          Write-Host "    Setting password for $username..." -ForegroundColor Cyan
          net user $username $plainPassword 2>&1 | Out-Null
          net user $username /expires:never 2>&1 | Out-Null
          net user $username /active:yes 2>&1 | Out-Null
          Write-Host "    ✓  Password configured" -ForegroundColor Green

          Write-Host "    Assigning group membership..." -ForegroundColor Cyan
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Write-Host "    ✓  Administrators + Remote Desktop Users" -ForegroundColor Green

          Write-Host ""
          Write-Host "    Account summary:" -ForegroundColor Cyan
          Get-LocalUser -Name $username | Format-Table Name, Enabled, LastLogon -AutoSize | Out-String | Write-Host

          Write-Host "  └─ User ready" -ForegroundColor Green
          Write-Host ""

      - name: "[6/9]  Install 7-Zip"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ 7-Zip Install ──────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZipExe) {
            Write-Host "    ✓  7-Zip already installed" -ForegroundColor Green
          } else {
            Write-Host "    Installing 7-Zip..." -ForegroundColor Cyan
            $sevenZipMsi = "$env:TEMP\7z-installer.msi"
            try {
              Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2301-x64.msi" -OutFile $sevenZipMsi -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i $sevenZipMsi /quiet /norestart" -Wait
              Start-Sleep -Seconds 5
              Write-Host "    ✓  7-Zip installed" -ForegroundColor Green
            } catch {
              Write-Host "    ✗  Install failed: $_" -ForegroundColor Red
              exit 1
            }
          }

          if (-not (Test-Path $sevenZipExe)) {
            Write-Host "    ✗  7z.exe not found" -ForegroundColor Red
            exit 1
          }

          Write-Host "    ✓  7z.exe ready: $sevenZipExe" -ForegroundColor Green
          Write-Host ""
          Write-Host "  └─ 7-Zip ready" -ForegroundColor Green
          Write-Host ""

      - name: "[7/9]  Restore Environment from B2"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Environment Restore ─────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
          $env:AWS_DEFAULT_REGION    = $env:B2_REGION
          $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          $endpoint = "https://$env:B2_ENDPOINT"

          Write-Host "    Listing remote objects..." -ForegroundColor Cyan
          $remoteObjects = & $aws s3api list-objects-v2 --bucket $env:B2_BUCKET --endpoint-url $endpoint --query "Contents[].Key" --output text 2>&1
          $remoteKeys = @()
          if ($remoteObjects -and $LASTEXITCODE -eq 0) {
            $remoteKeys = ($remoteObjects -split '\s+' | Where-Object { $_ -and $_ -ne 'None' })
            foreach ($k in $remoteKeys) {
              Write-Host "      • $k" -ForegroundColor Gray
            }
          } else {
            Write-Host "      (empty)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "    Checking for Telegram Portable on B2..." -ForegroundColor Cyan
          $tgZipName  = "telegram-portable.zip"
          $localTgZip = "C:\telegram-portable.zip"

          $tgExists = $remoteKeys -contains $tgZipName

          if ($tgExists) {
            Write-Host "    ✓  Telegram Portable found on B2 — downloading..." -ForegroundColor Green
            $tgDownloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $aws s3api get-object --bucket $env:B2_BUCKET --key $tgZipName --endpoint-url $endpoint $localTgZip 2>&1 | Out-Null
              if ((Test-Path $localTgZip) -and ((Get-Item $localTgZip).Length -gt 0)) {
                $tgDownloaded = $true
                break
              }
              Start-Sleep -Seconds 5
            }
            if ($tgDownloaded) {
              $sizeMB = [math]::Round((Get-Item $localTgZip).Length / 1MB, 2)
              Write-Host "    ✓  Downloaded: $sizeMB MB" -ForegroundColor Green
            } else {
              Write-Host "    ⚠  Download failed — falling back to telegram.org" -ForegroundColor Yellow
              $tgExists = $false
            }
          }

          if (-not $tgExists) {
            Write-Host "    ↓  Not on B2 — fetching from telegram.org" -ForegroundColor Yellow
            try {
              Invoke-WebRequest -Uri "https://telegram.org/dl/desktop/win64_portable" `
                -OutFile $localTgZip -UseBasicParsing -ErrorAction Stop
              $sizeMB = [math]::Round((Get-Item $localTgZip).Length / 1MB, 2)
              Write-Host "    ✓  Downloaded: $sizeMB MB" -ForegroundColor Green
            } catch {
              Write-Host "    ⚠  Download failed: $_" -ForegroundColor Yellow
              $global:LASTEXITCODE = 0
              exit 0
            }

            Write-Host "    Purge old versions of telegram-portable.zip..." -ForegroundColor Cyan
            $tgVers = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix $tgZipName --endpoint-url $endpoint --query "Versions[].VersionId" --output text 2>&1
            if ($tgVers -and $LASTEXITCODE -eq 0 -and $tgVers -ne "None") {
              foreach ($vid in ($tgVers -split '\s+' | Where-Object { $_ })) {
                & $aws s3api delete-object --bucket $env:B2_BUCKET --key $tgZipName --version-id $vid --endpoint-url $endpoint 2>&1 | Out-Null
              }
            }
            $tgMarkers = & $aws s3api list-object-versions --bucket $env:B2_BUCKET --prefix $tgZipName --endpoint-url $endpoint --query "DeleteMarkers[].VersionId" --output text 2>&1
            if ($tgMarkers -and $LASTEXITCODE -eq 0 -and $tgMarkers -ne "None") {
              foreach ($mid in ($tgMarkers -split '\s+' | Where-Object { $_ })) {
                & $aws s3api delete-object --bucket $env:B2_BUCKET --key $tgZipName --version-id $mid --endpoint-url $endpoint 2>&1 | Out-Null
              }
            }
            Write-Host "    ✓  Old versions purged" -ForegroundColor Green

            Write-Host "    ↑  Uploading to B2..." -ForegroundColor Cyan
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $aws s3api put-object --bucket $env:B2_BUCKET --key $tgZipName --endpoint-url $endpoint --body $localTgZip 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "    ✓  Uploaded to B2" -ForegroundColor Green
                break
              }
              Start-Sleep -Seconds 10
            }
          }

          Write-Host ""
          Write-Host "    Checking for user backup..." -ForegroundColor Cyan
          $backupExists = $remoteKeys -contains "userdata.zip"

          if (-not $backupExists) {
            Write-Host "    ⓘ  No backup found (first run)" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "  └─ Restore skipped" -ForegroundColor Green
            Write-Host ""
            $global:LASTEXITCODE = 0
            exit 0
          }

          Write-Host "    ↓  Downloading userdata.zip..." -ForegroundColor Cyan
          $backupZip  = "C:\userdata.zip"
          $downloaded = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $aws s3api get-object --bucket $env:B2_BUCKET --key "userdata.zip" --endpoint-url $endpoint $backupZip 2>&1 | Out-Null
            if ((Test-Path $backupZip) -and ((Get-Item $backupZip).Length -gt 0)) {
              $downloaded = $true
              break
            }
            Start-Sleep -Seconds 10
          }

          if (-not $downloaded) {
            Write-Host "    ⚠  Download failed" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          $sizeMB = [math]::Round((Get-Item $backupZip).Length / 1MB, 2)
          Write-Host "    ✓  Downloaded: $sizeMB MB" -ForegroundColor Green

          Write-Host "    Extracting user data with 7-Zip..." -ForegroundColor Cyan
          $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"
          try {
            & $sevenZipExe x $backupZip "-oC:\Users\runneradmin" -y -bso0 -bsp0 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "    ✓  Extracted to C:\Users\runneradmin" -ForegroundColor Green
            } else {
              Write-Host "    ⚠  7z exited with code $LASTEXITCODE" -ForegroundColor Yellow
            }
          } catch {
            Write-Host "    ⚠  Extract warning: $_" -ForegroundColor Yellow
          }
          Remove-Item $backupZip -Force -ErrorAction SilentlyContinue

          $tgAppFolder = "C:\Users\runneradmin\AppData\Local\Telegram"
          $tgExe       = "$tgAppFolder\Telegram.exe"
          if (-not (Test-Path $tgExe)) {
            $found = Get-ChildItem $tgAppFolder -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $tgExe = $found.FullName }
          }

          if (Test-Path $tgExe) {
            Write-Host "    ✓  Telegram restored at: $tgExe" -ForegroundColor Green
            $tdataPath = Join-Path (Split-Path $tgExe) "tdata"
            if (Test-Path $tdataPath) {
              $tdataSize = (Get-ChildItem $tdataPath -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "    ✓  tdata: $([math]::Round($tdataSize/1MB,2)) MB" -ForegroundColor Green
            }
          }

          $regFile = "C:\Users\runneradmin\Documents\_rdp-config\desktop-icons.reg"
          if (Test-Path $regFile) {
            Write-Host "    ✓  Desktop layout file found" -ForegroundColor Green
            Copy-Item $regFile "C:\desktop-icons.reg" -Force
          } else {
            Write-Host "    ⓘ  No desktop layout file found" -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "  └─ Restore complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[8/9]  Setup Telegram and Desktop"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Telegram and Desktop ────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          $userDir      = "C:\Users\runneradmin"
          $desktop      = "$userDir\Desktop"
          $tgFinalDir   = "$userDir\AppData\Local\Telegram"
          $tgExe        = "$tgFinalDir\Telegram.exe"
          $tgZip        = "C:\telegram-portable.zip"
          $tgExtractTmp = "C:\tg-temp-extract"
          $sevenZipExe  = "C:\Program Files\7-Zip\7z.exe"

          if (-not (Test-Path $desktop)) {
            New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          }

          if (Test-Path $tgExe) {
            Write-Host "    ✓  Telegram already present" -ForegroundColor Green
          } else {
            $nested = "$tgFinalDir\Telegram\Telegram.exe"
            if (Test-Path $nested) {
              Write-Host "    ⌁  Fixing nested folder structure..." -ForegroundColor Yellow
              $nestedDir = "$tgFinalDir\Telegram"
              Get-ChildItem -Path $nestedDir -Force | ForEach-Object {
                Move-Item -Path $_.FullName -Destination $tgFinalDir -Force
              }
              Remove-Item $nestedDir -Force -Recurse -ErrorAction SilentlyContinue
              Write-Host "    ✓  Structure fixed" -ForegroundColor Green
            } else {
              Write-Host "    ↓  Fetching Telegram from B2..." -ForegroundColor Cyan

              $env:AWS_ACCESS_KEY_ID     = $env:B2_KEY_ID
              $env:AWS_SECRET_ACCESS_KEY = $env:B2_APP_KEY
              $env:AWS_DEFAULT_REGION    = $env:B2_REGION
              $aws      = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
              $endpoint = "https://$env:B2_ENDPOINT"

              & $aws s3api get-object --bucket $env:B2_BUCKET --key "telegram-portable.zip" --endpoint-url $endpoint $tgZip 2>&1 | Out-Null

              if (-not (Test-Path $tgZip) -or ((Get-Item $tgZip).Length -eq 0)) {
                Write-Host "    ⚠  Download from B2 failed" -ForegroundColor Yellow
                $global:LASTEXITCODE = 0
                exit 0
              }

              $sizeMB = [math]::Round((Get-Item $tgZip).Length / 1MB, 2)
              Write-Host "    ✓  Downloaded: $sizeMB MB" -ForegroundColor Green

              if (Test-Path $tgExtractTmp) { Remove-Item $tgExtractTmp -Recurse -Force }
              New-Item -ItemType Directory -Path $tgExtractTmp -Force | Out-Null

              Write-Host "    Extracting archive with 7-Zip..." -ForegroundColor Cyan
              try {
                & $sevenZipExe x $tgZip "-o$tgExtractTmp" -y -bso0 -bsp0 2>&1 | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "    ✓  Extracted to temp" -ForegroundColor Green
                } else {
                  Write-Host "    ⚠  7z exited with code $LASTEXITCODE" -ForegroundColor Yellow
                }
              } catch {
                Write-Host "    ⚠  Extract failed: $_" -ForegroundColor Yellow
                $global:LASTEXITCODE = 0
                exit 0
              }
              Remove-Item $tgZip -Force -ErrorAction SilentlyContinue

              $foundExe = Get-ChildItem $tgExtractTmp -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $foundExe) {
                Write-Host "    ⚠  Telegram.exe not found in archive" -ForegroundColor Yellow
                Remove-Item $tgExtractTmp -Recurse -Force -ErrorAction SilentlyContinue
                $global:LASTEXITCODE = 0
                exit 0
              }

              $sourceDir = $foundExe.Directory.FullName
              if (-not (Test-Path $tgFinalDir)) {
                New-Item -ItemType Directory -Path $tgFinalDir -Force | Out-Null
              }

              Write-Host "    Moving files to target..." -ForegroundColor Cyan
              Get-ChildItem -Path $sourceDir -Force | ForEach-Object {
                Move-Item -Path $_.FullName -Destination $tgFinalDir -Force
              }

              Remove-Item $tgExtractTmp -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "    ✓  Installed at: $tgFinalDir" -ForegroundColor Green
            }
          }

          if (-not (Test-Path $tgExe)) {
            $found = Get-ChildItem $tgFinalDir -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $tgExe = $found.FullName }
          }

          if (-not (Test-Path $tgExe)) {
            Write-Host "    ⚠  Telegram.exe not found" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
            exit 0
          }

          $shortcut = "$desktop\Telegram.lnk"
          Write-Host "    Creating desktop shortcut..." -ForegroundColor Cyan
          try {
            $ws = New-Object -ComObject WScript.Shell
            $sc = $ws.CreateShortcut($shortcut)
            $sc.TargetPath       = $tgExe
            $sc.WorkingDirectory = Split-Path $tgExe
            $sc.IconLocation     = "$tgExe,0"
            $sc.Save()
            Write-Host "    ✓  Shortcut created" -ForegroundColor Green
          } catch {
            Write-Host "    ⚠  Shortcut failed: $_" -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "    Cleaning up default desktop shortcuts..." -ForegroundColor Cyan
          $removeIcons = @(
            "Unity Hub.lnk",
            "Firefox.lnk",
            "Microsoft Edge.lnk",
            "R 4.6.1.lnk"
          )

          $desktopPaths = @(
            "C:\Users\Public\Desktop",
            "C:\Users\runneradmin\Desktop"
          )

          foreach ($path in $desktopPaths) {
            if (Test-Path $path) {
              foreach ($icon in $removeIcons) {
                $iconPath = Join-Path $path $icon
                if (Test-Path $iconPath) {
                  Remove-Item $iconPath -Force -ErrorAction SilentlyContinue
                  Write-Host "      ✓  Removed: $icon" -ForegroundColor Green
                }
              }
            }
          }

          Write-Host ""
          Write-Host "    Desktop contents:" -ForegroundColor Cyan
          Get-ChildItem $desktop -Force -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "      • $($_.Name)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "    Telegram folder contents:" -ForegroundColor Cyan
          Get-ChildItem $tgFinalDir -Force -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "      • $($_.Name)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "  └─ Setup complete" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

      - name: "[9/9]  Apply Desktop Layout"
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "  ┌─ Desktop Layout ──────────────────────────────────────┐" -ForegroundColor Yellow
          Write-Host ""

          Write-Host "    Enabling system icons..." -ForegroundColor Cyan
          $sysIconsKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $sysIconsKey)) {
            New-Item -Path $sysIconsKey -Force | Out-Null
          }
          Set-ItemProperty -Path $sysIconsKey -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $sysIconsKey -Name "{645FF040-5081-101B-9F08-00AA002F954E}" -Value 0 -Type DWord -Force
          Write-Host "    ✓  This PC and Recycle Bin enabled" -ForegroundColor Green

          $regFile = "C:\desktop-icons.reg"
          if (Test-Path $regFile) {
            Write-Host "    Importing layout..." -ForegroundColor Cyan
            reg import $regFile 2>&1 | Out-Null
            Write-Host "    ✓  Layout imported" -ForegroundColor Green
          } else {
            Write-Host "    ⓘ  No layout file to import" -ForegroundColor Yellow
          }

          Write-Host "    Restarting Explorer..." -ForegroundColor Cyan
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer
          }
          Start-Sleep -Seconds 3
          Write-Host "    ✓  Explorer restarted" -ForegroundColor Green

          Write-Host ""
          Write-Host "  └─ Layout applied" -ForegroundColor Green
          Write-Host ""

          $global:LASTEXITCODE = 0
          exit 0

